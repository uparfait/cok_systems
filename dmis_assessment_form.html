<html lang="en">
<head>

<style>

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); line-height: 1.45; }

.lang-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.lang-wrap select { padding: 6px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,.6); background: #fff; color: var(--text); font-size: 13px; }
main { max-width: 860px; margin: 0 auto; padding: 22px 16px 120px; }
.intro { background: var(--card); border-left: 5px solid var(--blue); padding: 16px 18px; margin-bottom: 18px; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.intro .label { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
.intro .hint, .q .hint, .note .hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.group { background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.group > .group-title { margin: 0; padding: 12px 18px; font-size: 16px; font-weight: 600; background: var(--accent); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; color: var(--blue-dark); }
.group > .group-body { padding: 8px 18px 14px; }
.group .group { margin: 12px 0; box-shadow: none; }
.group .group > .group-title { font-size: 14.5px; }
.note { padding: 10px 0 4px; }
.note .label { margin: 0; font-size: 14px; color: var(--text); }
.q { padding: 14px 0; border-bottom: 1px dashed var(--border); }
.q:last-child { border-bottom: none; }
.q .label { display: block; font-weight: 600; font-size: 14.5px; margin-bottom: 4px; }
.q .req { color: var(--error); margin-left: 3px; }
.q input[type=text], .q input[type=tel], .q input[type=number], .q input[type=datetime-local], .q textarea { width: 100%; max-width: 520px; padding: 9px 11px; border: 1px solid #b8c0cc; border-radius: 4px; font: inherit; font-size: 14px; background: #fff; margin-top: 6px; }
.q textarea { min-height: 96px; resize: vertical; }
.q input:focus, .q textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(11,92,171,.15); }
.options { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.options label { display: flex; align-items: flex-start; gap: 9px; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.options label:hover { background: var(--accent); }
.options input { margin: 3px 0 0; accent-color: var(--blue); flex-shrink: 0; }
.options .empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 4px 0; }
.q.invalid .label { color: var(--error); }
.q.invalid input, .q.invalid textarea { border-color: var(--error); }
.error { color: var(--error); font-size: 13px; margin: 6px 0 0; display: none; }
.q.invalid .error { display: block; }
.gps { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.gps .readout { font-size: 13px; color: var(--muted); }
.gps .readout.has { color: var(--ok); }
button.btn { background: var(--blue); color: #fff; border: none; border-radius: 4px; padding: 9px 16px; font: inherit; font-size: 14px; cursor: pointer; }
button.btn:hover { background: var(--blue-dark); }
button.btn.secondary { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
.file-wrap { margin-top: 6px; }
.file-wrap input[type=file] { font-size: 13px; }
.file-wrap img { display: block; margin-top: 8px; max-width: 220px; max-height: 160px; border: 1px solid var(--border); border-radius: 4px; }
.hidden { display: none !important; }
.footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: center; gap: 12px; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
.summary { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.summary.open { display: flex; }
.summary .panel { background: #fff; border-radius: 6px; max-width: 720px; width: 100%; max-height: 85vh; overflow: auto; padding: 18px 20px; }
.summary pre { background: #f7f8fa; border: 1px solid var(--border); padding: 12px; font-size: 12px; overflow: auto; }
.form-error { color: var(--error); font-size: 13px; margin: 0; align-self: center; }
@media (max-width: 600px) { .top-bar { flex-direction: column; align-items: flex-start; } .group > .group-body { padding: 6px 12px 12px; } }
</style>

<script>
(function () {
  const values = {};
  let lang = FORM.default_language;
  const root = document.getElementById("form-root");
  const byId = {};
  const nodes = [];

  // ---- expression helpers (the form's own logic, compiled to JS) -------
  const V = (id) => { const v = values[id]; if (v === undefined || v === null) return ""; if (Array.isArray(v)) return v.join(" "); if (typeof v === "object") return v.text || ""; return String(v); };
  const NV = (id) => { const s = V(id); return s === "" ? NaN : Number(s); };
  const SEL = (list, v) => String(list || "").split(/\s+/).filter(Boolean).includes(String(v));
  const RX = (x, re) => new RegExp(re).test(String(x));
  const RND = (x, d) => { const f = Math.pow(10, d || 0); return Math.round(x * f) / f; };
  const fns = {};
  const fn = (src, kind) => {
    if (!src) return null;
    const key = kind + ":" + src;
    if (!fns[key]) fns[key] = new Function("V", "NV", "X", "I", "SEL", "RX", "RND", "return (" + src + ");");
    return fns[key];
  };
  const evalLogic = (src, x) => { const f = fn(src, "l"); if (!f) return true; try { return !!f(V, NV, x, null, SEL, RX, RND); } catch (e) { return false; } };
  const evalFilter = (src, item) => { const f = fn(src, "f"); if (!f) return true; try { return !!f(V, NV, "", item, SEL, RX, RND); } catch (e) { return false; } };
  const evalCalc = (src) => { const f = fn(src, "c"); try { const r = f(V, NV, "", null, SEL, RX, RND); return (typeof r === "number" && !isFinite(r)) ? "" : String(r); } catch (e) { return ""; } };

  const t = (obj) => (obj && (obj[lang] || obj.en)) || "";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

  // ---- rendering -------------------------------------------------------
  function renderList(list, container, ancestors) {
    list.forEach((entry) => {
      if (entry.kind === "calculate") return;
      if (entry.kind === "group") {
        const g = el("section", "group");
        g.dataset.id = entry.id;
        if (!entry.labelless) g.appendChild(el("h2", "group-title", t(entry.label)));
        const body = el("div", "group-body");
        g.appendChild(body);
        container.appendChild(g);
        nodes.push({ entry, dom: g, ancestors });
        renderList(entry.children, body, ancestors.concat([entry]));
        return;
      }
      const wrap = el("div", entry.kind === "note" ? "note" : "q");
      wrap.dataset.id = entry.id;
      const label = el("p", "label");
      wrap.appendChild(label);
      const hint = el("p", "hint");
      wrap.appendChild(hint);
      if (entry.kind === "question") {
        wrap.appendChild(buildControl(entry));
        wrap.appendChild(el("p", "error"));
      }
      container.appendChild(wrap);
      byId[entry.id] = { entry, dom: wrap, ancestors };
      nodes.push(byId[entry.id]);
    });
  }

  function set(id, value) {
    values[id] = value;
    refresh();
  }

  function buildControl(q) {
    const c = q.control;
    if (c === "select_one" || c === "select_multiple") {
      const box = el("div", "options");
      box.dataset.instance = q.instance;
      return box;
    }
    if (q.type === "geopoint") {
      const box = el("div", "gps");
      const btn = el("button", "btn secondary", "");
      btn.type = "button";
      btn.dataset.role = "gps";
      const out = el("span", "readout", "");
      box.appendChild(btn);
      box.appendChild(out);
      btn.addEventListener("click", () => {
        if (!navigator.geolocation) { out.textContent = "Geolocation is not available on this device."; return; }
        btn.disabled = true;
        out.textContent = "...";
        navigator.geolocation.getCurrentPosition((pos) => {
          const c2 = pos.coords;
          const text = [c2.latitude.toFixed(6), c2.longitude.toFixed(6), (c2.altitude || 0).toFixed(1), (c2.accuracy || 0).toFixed(1)].join(" ");
          set(q.id, { text, latitude: c2.latitude, longitude: c2.longitude, altitude: c2.altitude, accuracy: c2.accuracy });
          btn.disabled = false;
        }, (err) => { out.textContent = err.message; btn.disabled = false; }, { enableHighAccuracy: true, timeout: 20000 });
      });
      return box;
    }
    if (c === "file") {
      const box = el("div", "file-wrap");
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      const img = document.createElement("img");
      img.className = "hidden";
      input.addEventListener("change", () => {
        const file = input.files && input.files[0];
        if (!file) { img.className = "hidden"; set(q.id, ""); return; }
        img.src = URL.createObjectURL(file);
        img.className = "";
        set(q.id, { text: file.name, name: file.name, size: file.size, type: file.type, file });
      });
      box.appendChild(input);
      box.appendChild(img);
      return box;
    }
    if (c === "textarea") {
      const ta = document.createElement("textarea");
      ta.addEventListener("input", () => set(q.id, ta.value));
      return ta;
    }
    const input = document.createElement("input");
    if (c === "number") { input.type = "number"; input.step = q.type === "int" ? "1" : "any"; input.inputMode = q.type === "int" ? "numeric" : "decimal"; }
    else if (c === "tel") { input.type = "tel"; input.inputMode = "numeric"; }
    else if (c === "datetime-local") { input.type = "datetime-local"; }
    else { input.type = "text"; }
    input.addEventListener("input", () => set(q.id, input.value));
    return input;
  }

  function renderOptions(node) {
    const q = node.entry;
    const box = node.dom.querySelector(".options");
    if (!box) return;
    const list = (FORM.lists[q.instance] || []).filter((item) => evalFilter(q.filter, item));
    const current = values[q.id];
    const key = lang + "|" + list.map((i) => i.v).join(",") + "|" + JSON.stringify(current || "");
    if (box.dataset.key === key) return;
    box.dataset.key = key;
    box.innerHTML = "";
    if (list.length === 0) {
      box.appendChild(el("p", "empty", t({ en: "No options available yet - answer the question above first.", rw: "Nta mahitamo ahari - banza usubize ikibazo kiri hejuru." })));
      return;
    }
    // A choice no longer offered (parent changed) is dropped, like ODK does.
    if (q.control === "select_one" && current && !list.some((i) => i.v === current)) { values[q.id] = ""; }
    if (q.control === "select_multiple" && Array.isArray(current)) { const kept = current.filter((v) => list.some((i) => i.v === v)); if (kept.length !== current.length) values[q.id] = kept; }
    list.forEach((item) => {
      const lbl = el("label");
      const input = document.createElement("input");
      input.type = q.control === "select_one" ? "radio" : "checkbox";
      input.name = q.id;
      input.value = item.v;
      if (q.control === "select_one") input.checked = values[q.id] === item.v;
      else input.checked = Array.isArray(values[q.id]) && values[q.id].includes(item.v);
      input.addEventListener("change", () => {
        if (q.control === "select_one") set(q.id, item.v);
        else {
          const cur = Array.isArray(values[q.id]) ? values[q.id].slice() : [];
          const idx = cur.indexOf(item.v);
          if (input.checked && idx < 0) cur.push(item.v);
          if (!input.checked && idx >= 0) cur.splice(idx, 1);
          set(q.id, cur);
        }
      });
      lbl.appendChild(input);
      lbl.appendChild(el("span", "", t(item.l)));
      box.appendChild(lbl);
    });
  }

  function isRelevant(node) {
    return node.ancestors.every((g) => evalLogic(g.relevant, "")) && evalLogic(node.entry.relevant, V(node.entry.id));
  }

  function refresh() {
    // Calculations first - other logic may read them.
    FORM.calcs.forEach((calc) => { values[calc.id] = evalCalc(calc.calc); });
    let changed = true;
    let guard = 0;
    while (changed && guard < 5) {
      changed = false;
      guard += 1;
      nodes.forEach((node) => {
        const relevant = isRelevant(node);
        node.dom.classList.toggle("hidden", !relevant);
        if (node.entry.kind === "question") {
          const before = JSON.stringify(values[node.entry.id] || "");
          renderOptions(node);
          if (JSON.stringify(values[node.entry.id] || "") !== before) changed = true;
        }
      });
    }
    nodes.forEach((node) => { if (node.dom.classList.contains("q") && !node.dom.classList.contains("hidden")) validate(node, false); });
  }

  function validate(node, showRequired) {
    const q = node.entry;
    const raw = values[q.id];
    const text = V(q.id);
    const empty = raw === undefined || raw === null || raw === "" || (Array.isArray(raw) && raw.length === 0);
    let message = "";
    if (empty) {
      if (q.required && showRequired) message = t(FORM.required_message);
    } else if (q.constraint && !evalLogic(q.constraint, text)) {
      message = t(q.constraint_msg) || "Invalid value";
    }
    node.dom.classList.toggle("invalid", !!message);
    const err = node.dom.querySelector(".error");
    if (err) err.textContent = message;
    return !message;
  }

  function applyLanguage() {
    document.documentElement.lang = lang;
    document.getElementById("form-title").textContent = FORM.title;
    document.title = FORM.title;
    nodes.forEach((node) => {
      const e = node.entry;
      if (e.kind === "group") { const h = node.dom.querySelector(":scope > .group-title"); if (h) h.textContent = t(e.label); return; }
      const label = node.dom.querySelector(".label");
      label.textContent = "";
      label.appendChild(document.createTextNode(t(e.label)));
      if (e.required) label.appendChild(el("span", "req", "*"));
      const hint = node.dom.querySelector(".hint");
      const hintText = t(e.hint);
      hint.textContent = hintText;
      hint.classList.toggle("hidden", !hintText);
      const gps = node.dom.querySelector("[data-role=gps]");
      if (gps) gps.textContent = t({ en: "Capture GPS", rw: "Fata GPS" });
      const box = node.dom.querySelector(".options");
      if (box) box.dataset.key = "";
    });
    const intro = document.querySelector(".intro");
    if (intro) { intro.querySelector(".label").textContent = t(FORM.tree[0].label); intro.querySelector(".hint").textContent = t(FORM.tree[0].hint); }
    document.getElementById("submit-btn").textContent = t({ en: "Submit", rw: "Ohereza" });
    document.getElementById("reset-btn").textContent = t({ en: "Reset", rw: "Siba byose" });
    refresh();
  }

  // ---- boot --------------------------------------------------------------
  const first = FORM.tree[0];
  const rest = first && first.kind === "note" ? FORM.tree.slice(1) : FORM.tree;
  if (first && first.kind === "note") {
    const intro = el("div", "intro");
    intro.appendChild(el("p", "label"));
    intro.appendChild(el("p", "hint"));
    root.appendChild(intro);
  }
  renderList(rest, root, []);

  const select = document.getElementById("form-languages");
  FORM.languages.forEach((language) => { const o = document.createElement("option"); o.value = language.code; o.textContent = language.name; select.appendChild(o); });
  select.value = lang;
  select.addEventListener("change", () => { lang = select.value; applyLanguage(); });

  document.getElementById("submit-btn").addEventListener("click", () => {
    let firstBad = null;
    nodes.forEach((node) => {
      if (!node.dom.classList.contains("q") || node.dom.classList.contains("hidden")) return;
      if (!validate(node, true) && !firstBad) firstBad = node;
    });
    const formError = document.getElementById("form-error");
    if (firstBad) {
      formError.textContent = t({ en: "Please correct the highlighted fields.", rw: "Kosora imyanya yagaragajwe." });
      firstBad.dom.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    formError.textContent = "";
    const data = {};
    nodes.forEach((node) => {
      if (node.entry.kind !== "question" || node.dom.classList.contains("hidden")) return;
      const v = values[node.entry.id];
      if (v === undefined || v === "" || (Array.isArray(v) && v.length === 0)) return;
      data[node.entry.path] = Array.isArray(v) ? v.join(" ") : (typeof v === "object" ? (v.text || v.name) : v);
    });
    FORM.calcs.forEach((calc) => { if (values[calc.id] !== "") data[calc.path] = values[calc.id]; });
    document.getElementById("summary-json").textContent = JSON.stringify(data, null, 2);
    document.getElementById("summary").classList.add("open");
  });
  document.getElementById("summary-close").addEventListener("click", () => document.getElementById("summary").classList.remove("open"));
  document.getElementById("reset-btn").addEventListener("click", () => {
    Object.keys(values).forEach((k) => delete values[k]);
    root.querySelectorAll("input, textarea").forEach((i) => { if (i.type === "radio" || i.type === "checkbox") i.checked = false; else i.value = ""; });
    root.querySelectorAll(".file-wrap img").forEach((img) => img.classList.add("hidden"));
    root.querySelectorAll(".gps .readout").forEach((r) => { r.textContent = ""; r.classList.remove("has"); });
    document.getElementById("form-error").textContent = "";
    nodes.forEach((node) => { const box = node.dom.querySelector(".options"); if (box) box.dataset.key = ""; });
    refresh();
  });

  // GPS readout mirrors the stored value.
  const originalRefresh = refresh;
  refresh = function () {
    originalRefresh();
    nodes.forEach((node) => {
      const out = node.dom.querySelector(".gps .readout");
      if (!out) return;
      const v = values[node.entry.id];
      if (v && typeof v === "object") { out.textContent = "Lat " + v.latitude.toFixed(6) + ", Lon " + v.longitude.toFixed(6) + " (+/- " + Math.round(v.accuracy || 0) + " m)"; out.classList.add("has"); }
    });
  };

  applyLanguage();
})();
</script>
</body>
</html>
