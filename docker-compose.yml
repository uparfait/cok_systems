name: cok-systems

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: CoK-IkazeSys
      MONGO_INITDB_ROOT_PASSWORD: IKaZE!@2026sys
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    # No ports exposed — database is reachable only inside the Docker network

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2026
      conne_string: mongodb://CoK-IkazeSys:IKaZE%21%402026sys@mongo:27017/cok?authSource=admin
      JWT_SECRET: abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9f
      JWT_REFRESH_SECRET: abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9feeefc
      COOKIE_SECRET: abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9f-abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9feeefc
      CLIENT_URL_SET: uat-ikaze.kigalicity.gov.rw
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  em-backend:
    build: ./em_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2027
      DATABASE_URL2: mongodb://CoK-IkazeSys:IKaZE%21%402026sys@mongo:27017/COK_EVENT_MNG?authSource=admin
      DATABASE_NAME2: COK_EVENT_MNG
      FRONTEND_URL: https://uat-ikaze.kigalicity.gov.rw
      CORS_ORIGIN: https://uat-ikaze.kigalicity.gov.rw
    volumes:
      - em_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Tell the internal nginx/app to listen on port 5713
      PORT: 5713
    # Expose the port so it's accessible within the Docker network
    expose:
      - "5713"
    volumes:
      # Live nginx config — edit/swap files here without rebuilding the image
      - ./frontend/nginx:/etc/nginx/conf.d:ro
      # Shared with certbot: challenge files + issued certificates
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - em-backend
    # Reload nginx every 6h so renewed certificates are picked up
    command: sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Checks twice a day; renews automatically when <30 days remain
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  mongo_data:
  backend_uploads:
  em_uploads:
  certbot_www:
  certbot_conf: