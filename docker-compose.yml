name: cok-systems

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: CoK-IkazeSys
      MONGO_INITDB_ROOT_PASSWORD: IKaZE!@2026sys
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2026
      conne_string: mongodb://CoK-IkazeSys:IKaZE%21%402026sys@mongo:27017/cok?authSource=admin
      JWT_SECRET: abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9f
      JWT_REFRESH_SECRET: abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9feeefc
      COOKIE_SECRET: abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9f-abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9feeefc
      CLIENT_URL_SET: uat-ikaze.kigalicity.gov.rw
      EMAIL_USER: coksystems@kigalicity.gov.rw
      EMAIL_PASS: CTown@2025!&
      EMAIL_FROM: IKAZE
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  em-backend:
    build: ./em_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2027
      DATABASE_URL2: mongodb://CoK-IkazeSys:IKaZE%21%402026sys@mongo:27017/COK_EVENT_MNG?authSource=admin
      DATABASE_NAME2: COK_EVENT_MNG
      FRONTEND_URL: https://uat-ikaze.kigalicity.gov.rw
      CORS_ORIGIN: https://uat-ikaze.kigalicity.gov.rw
      EMAIL_USER: coksystems@kigalicity.gov.rw
      EMAIL_PASS: CTown@2025!&
      EMAIL_FROM: IKAZE
    volumes:
      - em_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  # dc-backend:
  #   build: ./dc_backend
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: production
  #     DC_PORT: 8765
  #     conne_string: mongodb://CoK-IkazeSys:IKaZE%21%402026sys@mongo:27017/data_collection_system?authSource=admin
  #     COK_DB_NAME: cok
  #     JWT_SECRET: abd32fe-1c3f-4b6a-9d2e-0f5b8c6e7a9f
  #     CLIENT_URL_SET: uat-ikaze.kigalicity.gov.rw
  #   volumes:
  #     - dc_uploads:/app/uploads
  #   depends_on:
  #     mongo:
  #       condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: 5713
      VITE_API_URL: https://uatps-ikaze.kigalicity.gov.rw
      VITE_API_EVENT_URL: https://uate-ikaze.kigalicity.gov.rw
      VITE_API_DCS_URL: https://uatdcs-ikaze.kigalicity.gov.rw
    expose:
      - "5713"
    volumes:
      - ./frontend/nginx:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - em-backend
      # Removed dc-backend since it is commented out above
    command: sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  mongo_data:
  backend_uploads:
  em_uploads:
  dc_uploads:
  certbot_www:
  certbot_conf: