name: cok-systems

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: CoK-IkazeSys
      MONGO_INITDB_ROOT_PASSWORD: IKaZE!@2026sys
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  em-backend:
    build: ./em_backend
    restart: unless-stopped
    env_file:
      - ./em_backend/.env
    volumes:
      - em_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  # dc-backend:
  #   build: ./dc_backend
  #   restart: unless-stopped
  #   env_file:
  #     - ./dc_backend/.env
  #   volumes:
  #     - dc_uploads:/app/uploads
  #   depends_on:
  #     mongo:
  #       condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    expose:
      - "5713"
    volumes:
      - ./frontend/nginx:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - em-backend
    command: sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  mongo_data:
  backend_uploads:
  em_uploads:
  dc_uploads:
  certbot_www:
  certbot_conf: