  # ═══════════════════════════════════════════════════════
  # PARFAIT - VISITORS / SERVICE DELIVERY
  # ═══════════════════════════════════════════════════════

  /servicedelivery/visitor:
    get:
      tags: [PARFAIT - Visitors]
      summary: "List All Visitors"
      operationId: listVisitors
      description: "Filter by in_house status. Default returns only visitors currently in-house."
      parameters:
        - name: in_house
          in: query
          schema: { type: boolean, default: true }
          description: "true = currently in-house, false = already left"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

  /servicedelivery/visitor/search:
    get:
      tags: [PARFAIT - Visitors]
      summary: "Search Visitors"
      operationId: searchVisitors
      description: "Searches across full_name, telephone, identification.number, and plate_number (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - name: in_house
          in: query
          schema: { type: boolean }
          description: "Optionally filter by in-house status"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /servicedelivery/visitor/by-department:
    get:
      tags: [PARFAIT - Visitors]
      summary: "Get Visitors by Department"
      operationId: getVisitorsByDepartment
      parameters:
        - name: department_id
          in: query
          required: false
          schema: { type: string }
          example: "DEPT-001"
          description: "Filter by department ID"
        - name: department_name
          in: query
          required: false
          schema: { type: string }
          example: "Finance"
          description: "Filter by department name (search)"
        - name: is_still_inhouse
          in: query
          required: false
          schema: { type: boolean }
          description: "Filter by in-house status"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '404': { description: Department not found }
        '500': { description: Server error }

  /servicedelivery/visitor/by-department-current/{id}:
    get:
      tags: [PARFAIT - Visitors]
      summary: "Get Current Visitors by Department ID"
      operationId: getVisitorsByDepartmentCurrent
      description: "Get total visitors count by department ID who are currently in house and have status not completed"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "DEPT-001"
          description: "Department ID"
      responses:
        '200':
          description: Current visitors by department
          content:
            application/json:
              example:
                success: true
                total_visitors: 25
                data:
                  - department_name: "Finance"
                    count: 10
        '500': { description: Server error }

  /servicedelivery/visitor/by-provider-current/{id}:
    get:
      tags: [PARFAIT - Visitors]
      summary: "Get Current Visitors by Provider ID"
      operationId: getVisitorsByProviderCurrent
      description: "Get total visitors count by provider ID who are currently in house and have status not completed"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "PROV-001"
          description: "Provider ID"
      responses:
        '200':
          description: Current visitors by provider
          content:
            application/json:
              example:
                success: true
                total_visitors: 20
                data:
                  - provider_id: "PROV-001"
                    provider_name: "ABC Services"
                    count: 8
        '500': { description: Server error }

  /servicedelivery/visitor/{id}:
    get:
      tags: [PARFAIT - Visitors]
      summary: "Get Visitor by MongoDB _id"
      operationId: getVisitorById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Found }
        '404': { description: Not found }
        '500': { description: Server error }

    put:
      tags: [PARFAIT - Visitors]
      summary: "Update Visitor by MongoDB _id"
      operationId: updateVisitor
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, example: "Jean Pierre Habimana" }
                telephone: { type: string, example: "+250788000111" }
                email: { type: string, example: "jean@example.com" }
                gender: { type: string, example: "Male" }
                identification: { type: object, example: { type: "National ID", number: "123456789" } }
                vehicle_storage: {
                  type: object,
                  example: {
                    has_vehicle: true,
                    vehicle_details: {
                      plate_number: "RAC123A",
                    }
                  }
                }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ObjectId }
        '404': { description: Not found }
        '500': { description: Server error }

  /servicedelivery/visitor/checkin:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Visitor Check-In"
      operationId: visitorCheckin
      description: "Registers a new visitor. If they have a vehicle, links to an active parking record automatically."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, telephone]
              properties:
                full_name: { type: string, example: "Jean Pierre Habimana" }
                telephone: { type: string, example: "+250788000111" }
                email: { type: string, example: "jean@example.com" }
                gender: { type: string, example: "Male" }
                badge_number: { type: string, example: "BADGE-001" }
                identification: { type: object, example: { type: "National ID", number: "123456789" } }
                vehicle_storage: {
                  type: object,
                  example: {
                    has_vehicle: true,
                    vehicle_details: {
                      plate_number: "RAC123A",
                    }
                  }
                }
      responses:
        '201': { description: Visitor checked in successfully }
        '400': { description: full_name is required }
        '500': { description: Server error }

  /servicedelivery/visitor/assign:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Assign Visitor to Department"
      operationId: assignVisitorToDepartment
      description: "Assigns an in-house visitor to a new department."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, new_department_id, new_department_name]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                new_department_id: { type: string, example: "DEPT-002" }
                new_department_name: { type: string, example: "Finance" }
      responses:
        '200': { description: Visitor assigned to new department }
        '400': { description: Missing required fields }
        '404': { description: Visitor not found }
        '500': { description: Server error }

  /servicedelivery/visitor/service/status:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Update Visitor Service Status"
      operationId: updateServiceStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, status]
              properties:
                visitor_id: { type: string }
                status: { type: string }
      responses:
        '200': { description: Status updated }
        '400': { description: Missing required fields }
        '404': { description: Visitor not found }

  /servicedelivery/visitor/emergency/leave-return:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Toggle Temporary Leave / Return"
      operationId: toggleTemporaryLeave
      description: "Marks a visitor as temporarily outside ('leave') or returned ('return'). Tracks duration and optionally logs items taken out."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, action]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                action:
                  type: string
                  enum: [leave, return]
                  example: "leave"
                items_exited_with:
                  type: array
                  items:
                    type: object
                    properties:
                      item_name: { type: string, example: "Laptop" }
                      quantity: { type: integer, example: 1 }
                provider_name: { type: string, example: "Jane Doe" }
                provider_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d2" }
                message: { type: string, example: "Visitor went to get documents from car" }
      responses:
        '200': { description: Visitor marked as outside or returned }
        '400': { description: Missing fields, already outside, or no active leave record to close }
        '404': { description: Visitor not found or not in-house }
        '500': { description: Server error }

  /servicedelivery/visitor/checkout:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Visitor Check-Out"
      operationId: visitorCheckout
      description: "Checks out a visitor. If they have a car still parked, sets status to pending until vehicle exits."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                items_exited_with:
                  type: array
                  items:
                    type: object
                    properties:
                      item_name: { type: string, example: "Laptop" }
                      quantity: { type: integer, example: 1 }
      responses:
        '200': { description: Visitor checked out or marked pending (car still parked) }
        '400': { description: visitor_id is required }
        '404': { description: Visitor not found or already checked out }
        '500': { description: Server error }

