      responses:
        '200':
          description: Available resources retrieved successfully
        '500':
          description: Server error }

  /roles/name/{name}:
    get:
      tags: [PARFAIT - Roles]
      summary: "Get role by name"
      operationId: getRoleByName
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "System Administrator"
      responses:
        '200': { description: Role retrieved successfully }
        '404': { description: Role not found }
        '500': { description: Server error }

  /roles/{id}:
    get:
      tags: [PARFAIT - Roles]
      summary: "Get role by ID"
      operationId: getRoleById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Role retrieved successfully }
        '400': { description: Invalid role ID format }
        '404': { description: Role not found }
        '500': { description: Server error }

    put:
      tags: [PARFAIT - Roles]
      summary: "Update role by ID"
      operationId: updateRole
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_name:
                  type: string
                permissions:
                  type: array
      responses:
        '200': { description: Role updated successfully }
        '400': { description: Validation error or invalid ID }
        '404': { description: Role not found }
        '409': { description: Role name already exists }
        '500': { description: Server error }

    delete:
      tags: [PARFAIT - Roles]
      summary: "Delete role by ID"
      operationId: deleteRole
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Role deleted successfully }
        '400': { description: Invalid role ID format }
        '404': { description: Role not found }
        '500': { description: Server error }

  /roles/{id}/permissions/toggle:
    put:
      tags: [PARFAIT - Roles]
      summary: "Toggle a specific permission"
      operationId: togglePermission
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_name, action]
              properties:
                resource_name:
                  type: string
                action:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200': { description: Permission toggled successfully }
        '400': { description: Missing required fields or invalid input }
        '404': { description: Role not found or permission not found }
        '500': { description: Server error }

  /roles/{id}/permissions/bulk:
    put:
      tags: [PARFAIT - Roles]
      summary: "Bulk update permissions"
      operationId: bulkUpdatePermissions
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
      responses:
        '200': { description: Permissions updated successfully }
        '400': { description: Validation error }
        '404': { description: Role not found }
        '500': { description: Server error }
