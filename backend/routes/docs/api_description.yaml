        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
          description: "Filter by active status"
        - name: is_account_activated
          in: query
          required: false
          schema: { type: boolean }
          description: "Filter by account activation status"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
