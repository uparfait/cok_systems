openapi: 3.0.3

info:
  title: COK Systems API
  version: "1.0.0"
  description: |
    Combined API Documentation for COK Systems
    - AMOS: Authentication & User Management
    - PARFAIT: Department, Employee, Visitor & Service Delivery Management

servers:
  - url: https://cok-bc.onrender.com/cok/api
    description: Production Test
  - url: http://localhost:2026/cok/api
    description: Local Test

tags:
  # AMOS Auth API Tags
  - name: AMOS - Authentication
    description: User login, logout, and session managements
  - name: AMOS - First-Time Login
    description: Account activation for new users
  - name: AMOS - Password Reset
    description: Password recovery and reset
  - name: AMOS - Account Lock
    description: Account locking and unlocking
  - name: AMOS - Feedback
    description: Service feedback and ratings

  # PARFAIT API Tags
  - name: PARFAIT - Departments
    description: Department CRUD operations
  - name: PARFAIT - Employees
    description: Employee management
  - name: PARFAIT - Visitors
    description: Visitor check-in, check-out and service delivery
  - name: PARFAIT - Vehicles
    description: Smart parking and vehicle management
  - name: PARFAIT - System Permissions
    description: Role-based access control

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MongoObjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: "64f1a2b3c4d5e6f7a8b9c0d1"

    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }

    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 10 }

    QueryParam:
      name: query
      in: query
      schema: { type: string, default: "" }
      description: "Search keyword (case-insensitive)"

    StatusParam:
      name: status
      in: query
      schema: { type: string, enum: ['active', 'completed'] }
      description: "Filter by parking record status (active or completed)"

security:
  - BearerAuth: []

paths:

  # ═══════════════════════════════════════════════════════
  # AMOS - AUTHENTICATION
  # ═══════════════════════════════════════════════════════

  /auth/login:
    post:
      tags: [AMOS - Authentication]
      summary: "Login - Step 1: Verify credentials and send OTP"
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: OTP sent successfully }
        '400': { description: Missing required fields }
        '401': { description: Invalid credentials }
        '403': { description: Account not activated or locked }

  /auth/login/verify:
    post:
      tags: [AMOS - Authentication]
      summary: "Login - Step 2: Verify OTP and get JWT token"
      operationId: verifyLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp]
              properties:
                userId: { type: string }
                otp: { type: string }
      responses:
        '200': { description: Login successful }
        '400': { description: Invalid or expired OTP }

  /auth/login/resend:
    post:
      tags: [AMOS - Authentication]
      summary: "Resend OTP for login"
      operationId: resendLoginOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
      responses:
        '200': { description: OTP resent successfully }
        '400': { description: User ID and email required }
        '403': { description: Account is locked }

  /auth/logout:
    post:
      tags: [AMOS - Authentication]
      summary: "Logout from current device"
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200': { description: Logged out successfully }

  /auth/logout/all:
    post:
      tags: [AMOS - Authentication]
      summary: "Logout from all devices"
      operationId: logoutAll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Logged out from all devices }

  # ═══════════════════════════════════════════════════════
  # AMOS - FIRST-TIME LOGIN
  # ═══════════════════════════════════════════════════════

  /auth/first-login/check:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Check if account needs activation"
      operationId: checkEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200': { description: Account found, can proceed }
        '400': { description: Account already activated }
        '403': { description: Account is locked }
        '404': { description: Account not found }

  /auth/first-login/send-otp:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Send OTP for account activation"
      operationId: sendActivationOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200': { description: OTP sent successfully }
        '400': { description: Account already activated }
        '403': { description: Account is locked }

  /auth/first-login/activate:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Activate account with OTP and set password"
      operationId: activateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp, newPassword, confirmPassword]
              properties:
                userId: { type: string }
                otp: { type: string }
                newPassword: { type: string }
                confirmPassword: { type: string }
      responses:
        '200': { description: Account activated successfully }
        '400': { description: Invalid OTP or password }
        '403': { description: Account is locked }

  /auth/first-login/resend:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Resend activation OTP"
      operationId: resendActivationOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
      responses:
        '200': { description: OTP resent successfully }
        '403': { description: Account is locked }

  # ═══════════════════════════════════════════════════════
  # AMOS - PASSWORD RESET
  # ═══════════════════════════════════════════════════════

  /auth/password-reset:
    post:
      tags: [AMOS - Password Reset]
      summary: "Request password reset - send OTP"
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200': { description: OTP sent }
        '403': { description: Account is locked }

  /auth/password-reset/verify:
    post:
      tags: [AMOS - Password Reset]
      summary: "Verify OTP for password reset"
      operationId: verifyPasswordResetOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp]
              properties:
                userId: { type: string }
                otp: { type: string }
      responses:
        '200': { description: OTP verified }
        '400': { description: Invalid or expired OTP }

  /auth/password-reset/reset:
    post:
      tags: [AMOS - Password Reset]
      summary: "Reset password with temp token"
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, tempToken, newPassword, confirmPassword]
              properties:
                userId: { type: string }
                tempToken: { type: string }
                newPassword: { type: string }
                confirmPassword: { type: string }
      responses:
        '200': { description: Password reset successfully }
        '400': { description: Invalid or expired token }

  /auth/password-reset/resend:
    post:
      tags: [AMOS - Password Reset]
      summary: "Resend password reset OTP"
      operationId: resendPasswordResetOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
      responses:
        '200': { description: OTP resent successfully }
        '403': { description: Account is locked }

  # ═══════════════════════════════════════════════════════
  # AMOS - ACCOUNT LOCK
  # ═══════════════════════════════════════════════════════

  /auth/lock-unlock:
    post:
      tags: [AMOS - Account Lock]
      summary: "Lock or unlock a user account"
      operationId: lockUnlockAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, action]
              properties:
                userId: { type: string }
                action: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Account locked/unlocked }
        '400': { description: Invalid action }
        '404': { description: User not found }

  /auth/lock-unlock/status:
    post:
      tags: [AMOS - Account Lock]
      summary: "Check account lock status"
      operationId: checkLockStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Lock status retrieved }
        '404': { description: User not found }

  /auth/lock-unlock/reset-attempts:
    post:
      tags: [AMOS - Account Lock]
      summary: "Reset login attempts for a user"
      operationId: resetLoginAttempts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Login attempts reset }
        '404': { description: User not found }

  # ═══════════════════════════════════════════════════════
  # AMOS - FEEDBACK
  # ═══════════════════════════════════════════════════════

  /feedback/verify-phone:
    post:
      tags: [AMOS - Feedback]
      summary: "Verify phone and get assigned departments"
      description: "Verifies if phone number exists in service delivery and returns assigned departments for feedback"
      operationId: verifyPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telephone]
              properties:
                telephone:
                  type: string
                  example: "+250788123456"
      responses:
        '200':
          description: Phone verified successfully
          content:
            application/json:
              example:
                success: true
                message: "Phone verified successfully"
                data:
                  visitor_name: "Uwayo parfait"
                  telephone: "+250788123456"
                  assigned_departments:
                    - department_id: "DEPT-001"
                      department_name: "Finance"
                      reached_in: true
        '404':
          description: No service record found

  /feedback/submit:
    post:
      tags: [AMOS - Feedback]
      summary: "Submit feedback for a department"
      description: "Submit rating and feedback for an assigned department"
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telephone, department_id, rate]
              properties:
                telephone:
                  type: string
                  example: "+250788123456"
                department_id:
                  type: string
                  example: "DEPT-001"
                rate:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 8
                textmessage:
                  type: string
                  maxLength: 500
                  example: "Great service!"
      responses:
        '201':
          description: Feedback submitted successfully
        '400':
          description: Validation error
        '403':
          description: Not assigned to this department
        '404':
          description: No service record found

  /feedback/search:
    get:
      tags: [AMOS - Feedback]
      summary: "Search all feedback with limit"
      description: "Query all feedback with optional pagination and limit"
      operationId: searchAllFeedback
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
          example: 50
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          example: 1
      responses:
        '200':
          description: Feedback list
          content:
            application/json:
              example:
                success: true
                message: "All feedback results"
                total: 100
                page: 1
                data: []

  /feedback/search-by-department:
    get:
      tags: [AMOS - Feedback]
      summary: "Search feedback by department with date range"
      description: "Query feedback by department_id with optional from and to date filters"
      operationId: searchByDepartment
      parameters:
        - name: department_id
          in: query
          required: true
          schema:
            type: string
          example: "DEPT-001"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-01"
          description: "Start date (YYYY-MM-DD)"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2024-12-31"
          description: "End date (YYYY-MM-DD)"
      responses:
        '200':
          description: Feedback search results
          content:
            application/json:
              example:
                success: true
                message: "Feedback search results"
                total: 10
                data: []
        '400':
          description: Invalid parameters

  /feedback/{id}:
    get:
      tags: [AMOS - Feedback]
      summary: "Get feedback by ID"
      description: "Retrieve a single feedback by MongoDB _id"
      operationId: getFeedbackById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200':
          description: Feedback details
          content:
            application/json:
              example:
                success: true
                message: "Feedback details"
                data: {}
        '400':
          description: Invalid ID format
        '404':
          description: Feedback not found

    delete:
      tags: [AMOS - Feedback]
      summary: "Delete feedback by ID"
      description: "Delete a feedback record by MongoDB _id"
      operationId: deleteFeedback
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200':
          description: Feedback deleted successfully
          content:
            application/json:
              example:
                success: true
                message: "Feedback deleted successfully"
        '400':
          description: Invalid ID format
        '404':
          description: Feedback not found

  # ═══════════════════════════════════════════════════════
  # PARFAIT - DEPARTMENTS
  # ═══════════════════════════════════════════════════════

  /department/crud:
    get:
      tags: [PARFAIT - Departments]
      summary: "List All Departments"
      operationId: listAllDepartments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

    post:
      tags: [PARFAIT - Departments]
      summary: "Create Department"
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_name, department_id, department_response_time_in_minutes]
              properties:
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                department_leader: { type: string, example: "Jane@gmail.com" }
                department_response_time_in_minutes: { type: integer, example: 5 }
      responses:
        '201': { description: Created }
        '400': { description: Missing required fields }
        '409': { description: department_id already exists }
        '500': { description: Server error }

  /department/crud/search:
    get:
      tags: [PARFAIT - Departments]
      summary: "Search Departments"
      operationId: searchDepartments
      description: "Searches across department_name and department_id fields (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /department/crud/leader/{email}:
    get:
      tags: [PARFAIT - Departments]
      summary: "Get Departments by Leader Email"
      operationId: getDepartmentsByLeaderEmail
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
          example: "jane@gmail.com"
      responses:
        '200': { description: OK }
        '404': { description: Not found }
        '500': { description: Server error }

  /department/crud/{department_id}:
    get:
      tags: [PARFAIT - Departments]
      summary: "Get Department by department_id"
      operationId: getDepartmentById
      parameters:
        - name: department_id
          in: path
          required: true
          schema: { type: string }
          example: "DEPT-001"
      responses:
        '200': { description: Found }
        '404': { description: Not found }
        '500': { description: Server error }

  /department/crud/{id}:
    put:
      tags: [PARFAIT - Departments]
      summary: "Update Department by MongoDB _id"
      operationId: updateDepartment
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_response_time_in_minutes, department_leader]
              properties:
                department_response_time_in_minutes: { type: integer, example: 5 }
                department_leader: { type: string, example: "Jane@gmail.com" }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ObjectId or missing fields }
        '404': { description: Not found }
        '500': { description: Server error }

    delete:
      tags: [PARFAIT - Departments]
      summary: "Delete Department by MongoDB _id"
      operationId: deleteDepartment
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid ObjectId }
        '404': { description: Not found }
        '500': { description: Server error }

  # ═══════════════════════════════════════════════════════
  # PARFAIT - EMPLOYEES
  # ═══════════════════════════════════════════════════════

  /employee/crud:
    get:
      tags: [PARFAIT - Employees]
      summary: "List All Employees"
      operationId: listAllEmployees
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

    post:
      tags: [PARFAIT - Employees]
      summary: "Create Employee"
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, telephone]
              properties:
                full_name: { type: string, example: "Alice Uwimana" }
                telephone: { type: string, example: "+250788123456" }
                email: { type: string, example: "alice.uwimana@cok.gov.rw" }
                identification: { type: object, example: { type: "National ID", number: "123456789" } }
                gender: { type: string, example: "Female" }
                title: { type: string, example: "Ms." }
                department_id: { type: string, example: "669efcbb56d78e89c7a" }
      responses:
        '201': { description: Created }
        '400': { description: Missing required fields }
        '409': { description: Email or telephone already exists }
        '500': { description: Server error }

  /employee/crud/search:
    get:
      tags: [PARFAIT - Employees]
      summary: "Search Employees"
      operationId: searchEmployees
      description: "Searches across full_name, telephone, email, and title fields (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /employee/crud/{id}:
    get:
      tags: [PARFAIT - Employees]
      summary: "Get Employee by MongoDB _id"
      operationId: getEmployeeById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Found }
        '404': { description: Not found }
        '500': { description: Server error }

    put:
      tags: [PARFAIT - Employees]
      summary: "Update Employee by MongoDB _id"
      operationId: updateEmployee
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, example: "Alice Uwimana" }
                telephone: { type: string, example: "+250788123456" }
                email: { type: string, example: "alice.uwimana@cok.gov.rw" }
                gender: { type: string, example: "Female" }
                title: { type: string, example: "Ms." }
                department_id: { type: string, example: "669efcbb56d78e89c7a" }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ObjectId }
        '404': { description: Not found }
        '409': { description: Email or telephone conflict }
        '500': { description: Server error }

    delete:
      tags: [PARFAIT - Employees]
      summary: "Delete Employee by MongoDB _id"
      operationId: deleteEmployee
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid ObjectId }
        '403': { description: Cannot delete own account }
        '404': { description: Not found or already deleted }
        '500': { description: Server error }

  # ═══════════════════════════════════════════════════════
  # PARFAIT - VISITORS
  # ═══════════════════════════════════════════════════════

  /servicedelivery/visitor:
    get:
      tags: [PARFAIT - Visitors]
      summary: "List All Visitors"
      operationId: listVisitors
      description: "Filter by in_house status. Default returns only visitors currently in-house."
      parameters:
        - name: in_house
          in: query
          schema: { type: boolean, default: true }
          description: "true = currently in-house, false = already left"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

  /servicedelivery/visitor/search:
    get:
      tags: [PARFAIT - Visitors]
      summary: "Search Visitors"
      operationId: searchVisitors
      description: "Searches across full_name, telephone, identification.number, and plate_number (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - name: in_house
          in: query
          schema: { type: boolean }
          description: "Optionally filter by in-house status"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }
  /servicedelivery/visitor/{id}:
     get:
       tags: [PARFAIT - Visitors]
       summary: "Get Visitor by MongoDB _id"
       operationId: getVisitorById
       parameters:
         - $ref: '#/components/parameters/MongoObjectId'
       responses:
         '200': { description: Found }
         '404': { description: Not found }
         '500': { description: Server error }
     put:
       tags: [PARFAIT - Visitors]
       summary: "Update Visitor by MongoDB _id"
       operationId: updateVisitor
       parameters:
         - $ref: '#/components/parameters/MongoObjectId'
       requestBody:
         required: true
         content:
           application/json:
             schema:
               type: object
               properties:
                 full_name: { type: string, example: "Jean Pierre Habimana" }
                 telephone: { type: string, example: "+250788000111" }
                 email: { type: string, example: "jean@example.com" }
                 gender: { type: string, example: "Male" }
                 identification: { type: object, example: { type: "National ID", number: "123456789" } }
                 vehicle_storage: {
                   type: object,
                   example: {
                     has_vehicle: true,
                     vehicle_details: {
                       plate_number: "RAC123A",
                     }
                   }
                 }
       responses:
         '200': { description: Updated }
         '400': { description: Invalid ObjectId }
         '404': { description: Not found }
         '500': { description: Server error }
  /servicedelivery/visitor/checkin:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Visitor Check-In"
      operationId: visitorCheckin
      description: "Registers a new visitor. If they have a vehicle, links to an active parking record automatically."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, telephone]
              properties:
                full_name: { type: string, example: "Jean Pierre Habimana" }
                telephone: { type: string, example: "+250788000111" }
                email: { type: string, example: "jean@example.com" }
                gender: { type: string, example: "Male" }
                identification: { type: object, example: { type: "National ID", number: "123456789" } }
                vehicle_storage: {
                  type: object,
                  example: {
                    has_vehicle: true,
                    vehicle_details: {
                      plate_number: "RAC123A",
                    }
                  }
                }
      responses:
        '201': { description: Visitor checked in successfully }
        '400': { description: full_name is required }
        '500': { description: Server error }

  /servicedelivery/visitor/assign:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Assign Visitor to Department"
      operationId: assignVisitorToDepartment
      description: "Assigns an in-house visitor to a new department."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, new_department_id, new_department_name]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                new_department_id: { type: string, example: "DEPT-002" }
                new_department_name: { type: string, example: "Finance" }
      responses:
        '200': { description: Visitor assigned to new department }
        '400': { description: Missing required fields }
        '404': { description: Visitor not found }
        '500': { description: Server error }

  /servicedelivery/visitor/service/status:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Update Visitor Service Status"
      operationId: updateServiceStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, status]
              properties:
                visitor_id: { type: string }
                status: { type: string }
      responses:
        '200': { description: Status updated }
        '400': { description: Missing required fields }
        '404': { description: Visitor not found }

  /servicedelivery/visitor/emergency/leave-return:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Toggle Temporary Leave / Return"
      operationId: toggleTemporaryLeave
      description: "Marks a visitor as temporarily outside ('leave') or returned ('return'). Tracks duration and optionally logs items taken out."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, action]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                action:
                  type: string
                  enum: [leave, return]
                  example: "leave"
                items_exited_with:
                  type: array
                  items:
                    type: object
                    properties:
                      item_name: { type: string, example: "Laptop" }
                      quantity: { type: integer, example: 1 }
                provider_name: { type: string, example: "Jane Doe" }
                provider_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d2" }
                message: { type: string, example: "Visitor went to get documents from car" }
      responses:
        '200': { description: Visitor marked as outside or returned }
        '400': { description: Missing fields, already outside, or no active leave record to close }
        '404': { description: Visitor not found or not in-house }
        '500': { description: Server error }

  /servicedelivery/visitor/checkout:
    post:
      tags: [PARFAIT - Visitors]
      summary: "Visitor Check-Out"
      operationId: visitorCheckout
      description: "Checks out a visitor. If they have a car still parked, sets status to pending until vehicle exits."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                items_exited_with:
                  type: array
                  items:
                    type: object
                    properties:
                      item_name: { type: string, example: "Laptop" }
                      quantity: { type: integer, example: 1 }
      responses:
        '200': { description: Visitor checked out or marked pending (car still parked) }
        '400': { description: visitor_id is required }
        '404': { description: Visitor not found or already checked out }
        '500': { description: Server error }

