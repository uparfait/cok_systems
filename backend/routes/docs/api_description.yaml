openapi: 3.0.3

info:
  title: COK Systems API
  version: "1.0.0"
  description: |
    Combined API Documentation for COK Systems
    - AMOS: Authentication, Feedback & User Management
    - PARFAIT: Service Delivery, Smart Parking, Statistics, Departments, Employees, Permissions & Roles

servers:
  - url: https://cok-bc.onrender.com/cok/api
    description: Production Test
  - url: http://localhost:2026/cok/api
    description: Local Test

tags:
  # AMOS API Tags
  - name: AMOS - Authentication
    description: User login, logout, and session management
  - name: AMOS - First-Time Login
    description: Account activation for new users
  - name: AMOS - Password Reset
    description: Password recovery and reset
  - name: AMOS - Account Lock
    description: Account locking and unlocking
  - name: AMOS - Feedback
    description: Service feedback and ratings

  # PARFAIT API Tags
  - name: PARFAIT - Departments
    description: Department CRUD operations
  - name: PARFAIT - Employees
    description: Employee management
  - name: PARFAIT - Visitors
    description: Visitor check-in, check-out and service delivery
  - name: PARFAIT - Vehicles
    description: Smart parking and vehicle management
  - name: PARFAIT - Statistics
    description: Analytics and data insights
  - name: PARFAIT - System Permissions
    description: System permissions management
  - name: PARFAIT - Roles
    description: Role-based access control

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MongoObjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: "64f1a2b3c4d5e6f7a8b9c0d1"

    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }

    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 10 }

    QueryParam:
      name: query
      in: query
      schema: { type: string, default: "" }
      description: "Search keyword (case-insensitive)"

    StatusParam:
      name: status
      in: query
      schema: { type: string, enum: ['active', 'completed'] }
      description: "Filter by parking record status (active or completed)"

security:
  - BearerAuth: []

paths:

  # ═══════════════════════════════════════════════════════
  # AMOS - AUTHENTICATION
  # ═══════════════════════════════════════════════════════

  /auth/login:
    post:
      tags: [AMOS - Authentication]
      summary: "Login - Step 1: Verify credentials and send OTP"
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: "user@example.com"
              password: "password123"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              example:
                success: true
                message: "OTP sent to your email"
                userId: "64f1a2b3c4d5e6f7a8b9c0d1"
        '400': { description: Missing required fields }
        '401': { description: Invalid credentials }
        '403': { description: Account not activated or locked }

  /auth/login/verify:
    post:
      tags: [AMOS - Authentication]
      summary: "Login - Step 2: Verify OTP and get JWT token"
      operationId: verifyLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp]
              properties:
                userId: { type: string }
                otp: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              otp: "123456"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                success: true
                message: "Login successful"
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  _id: "64f1a2b3c4d5e6f7a8b9c0d1"
                  email: "user@example.com"
                  full_name: "John Doe"
        '400': { description: Invalid or expired OTP }

  /auth/login/resend:
    post:
      tags: [AMOS - Authentication]
      summary: "Resend OTP for login"
      operationId: resendLoginOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              email: "user@example.com"
      responses:
        '200': { description: OTP resent successfully }
        '400': { description: User ID and email required }
        '403': { description: Account is locked }

  /auth/logout:
    post:
      tags: [AMOS - Authentication]
      summary: "Logout from current device"
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              example:
                success: true
                message: "Logged out successfully"

  /auth/logout/all:
    post:
      tags: [AMOS - Authentication]
      summary: "Logout from all devices"
      operationId: logoutAll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
      responses:
        '200':
          description: Logged out from all devices
          content:
            application/json:
              example:
                success: true
                message: "Logged out from all devices"

  # ═══════════════════════════════════════════════════════
  # AMOS - FIRST-TIME LOGIN
  # ═══════════════════════════════════════════════════════

  /auth/first-login/check:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Check if account needs activation"
      operationId: checkEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
            example:
              email: "user@example.com"
      responses:
        '200': { description: Account found, can proceed }
        '400': { description: Account already activated }
        '403': { description: Account is locked }
        '404': { description: Account not found }

  /auth/first-login/send-otp:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Send OTP for account activation"
      operationId: sendActivationOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
            example:
              email: "user@example.com"
      responses:
        '200': { description: OTP sent successfully }
        '400': { description: Account already activated }
        '403': { description: Account is locked }

  /auth/first-login/activate:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Activate account with signature (after OTP verification)"
      operationId: activateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, signature, newPassword, confirmPassword]
              properties:
                userId: { type: string }
                signature: { type: string, description: "Signature token received from /verify-otp endpoint" }
                newPassword: { type: string }
                confirmPassword: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              signature: "abc123signature"
              newPassword: "NewPassword123"
              confirmPassword: "NewPassword123"
      responses:
        '200': { description: Account activated successfully }
        '400': { description: Invalid or expired signature }
        '403': { description: Account is locked }

  /auth/first-login/resend:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Resend activation OTP"
      operationId: resendActivationOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              email: "user@example.com"
      responses:
        '200': { description: OTP resent successfully }
        '403': { description: Account is locked }

  /auth/first-login/verify-otp:
    post:
      tags: [AMOS - First-Time Login]
      summary: "Verify OTP before setting password"
      operationId: verifyFirstLoginOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp]
              properties:
                userId: { type: string }
                otp: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              otp: "123456"
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              example:
                success: true
                message: "OTP verified successfully"
                signature: "abc123signature"
        '400': { description: Invalid OTP or no OTP found }
        '404': { description: User not found }

  # ═══════════════════════════════════════════════════════
  # AMOS - PASSWORD RESET
  # ═══════════════════════════════════════════════════════

  /auth/password-reset:
    post:
      tags: [AMOS - Password Reset]
      summary: "Request password reset - send OTP"
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
            example:
              email: "user@example.com"
      responses:
        '200': { description: OTP sent }
        '403': { description: Account is locked }

  /auth/password-reset/verify:
    post:
      tags: [AMOS - Password Reset]
      summary: "Verify OTP for password reset"
      operationId: verifyPasswordResetOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp]
              properties:
                userId: { type: string }
                otp: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              otp: "123456"
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              example:
                success: true
                message: "OTP verified successfully"
                tempToken: "abc123tempToken"
        '400': { description: Invalid or expired OTP }

  /auth/password-reset/reset:
    post:
      tags: [AMOS - Password Reset]
      summary: "Reset password with temp token"
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, tempToken, newPassword, confirmPassword]
              properties:
                userId: { type: string }
                tempToken: { type: string }
                newPassword: { type: string }
                confirmPassword: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              tempToken: "abc123tempToken"
              newPassword: "NewPassword123"
              confirmPassword: "NewPassword123"
      responses:
        '200': { description: Password reset successfully }
        '400': { description: Invalid or expired token }

  /auth/password-reset/resend:
    post:
      tags: [AMOS - Password Reset]
      summary: "Resend password reset OTP"
      operationId: resendPasswordResetOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              email: "user@example.com"
      responses:
        '200': { description: OTP resent successfully }
        '403': { description: Account is locked }

  # ═══════════════════════════════════════════════════════
  # AMOS - ACCOUNT LOCK
  # ═══════════════════════════════════════════════════════

  /auth/lock-unlock:
    post:
      tags: [AMOS - Account Lock]
      summary: "Lock or unlock a user account"
      operationId: lockUnlockAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, action]
              properties:
                userId: { type: string }
                action: { type: string, enum: ['lock', 'unlock'] }
                reason: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
              action: "lock"
              reason: "Too many failed login attempts"
      responses:
        '200': { description: Account locked/unlocked }
        '400': { description: Invalid action }
        '404': { description: User not found }

  /auth/lock-unlock/status:
    post:
      tags: [AMOS - Account Lock]
      summary: "Check account lock status"
      operationId: checkLockStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
      responses:
        '200':
          description: Lock status retrieved
          content:
            application/json:
              example:
                success: true
                isLocked: true
                failedAttempts: 5
        '404': { description: User not found }

  /auth/lock-unlock/reset-attempts:
    post:
      tags: [AMOS - Account Lock]
      summary: "Reset login attempts for a user"
      operationId: resetLoginAttempts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
            example:
              userId: "64f1a2b3c4d5e6f7a8b9c0d1"
      responses:
        '200': { description: Login attempts reset }
        '404': { description: User not found }

  # ═══════════════════════════════════════════════════════
  # AMOS - FEEDBACK
  # ═══════════════════════════════════════════════════════

  /feedback/verify-phone:
    post:
      tags: [AMOS - Feedback]
      summary: "Verify phone and get assigned departments"
      description: "Verifies if phone number exists in service delivery and returns assigned departments for feedback"
      operationId: verifyPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telephone]
              properties:
                telephone:
                  type: string
                  example: "+250788123456"
      responses:
        '200':
          description: Phone verified successfully
          content:
            application/json:
              example:
                success: true
                message: "Phone verified successfully"
                data:
                  visitor_name: "Uwayo parfait"
                  telephone: "+250788123456"
                  assigned_departments:
                    - department_id: "DEPT-001"
                      department_name: "Finance"
                      reached_in: true
        '404':
          description: No service record found

  /feedback/submit:
    post:
      tags: [AMOS - Feedback]
      summary: "Submit feedback for a department"
      description: "Submit rating and feedback for an assigned department"
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telephone, department_id, rate]
              properties:
                telephone:
                  type: string
                  example: "+250788123456"
                department_id:
                  type: string
                  example: "DEPT-001"
                rate:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 8
                textmessage:
                  type: string
                  maxLength: 500
                  example: "Great service!"
      responses:
        '201':
          description: Feedback submitted successfully
        '400':
          description: Validation error
        '403':
          description: Not assigned to this department
        '404':
          description: No service record found

  /feedback/search:
    get:
      tags: [AMOS - Feedback]
      summary: "Search all feedback with limit"
      description: "Query all feedback with optional pagination and limit"
      operationId: searchAllFeedback
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
          example: 50
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          example: 1
      responses:
        '200':
          description: Feedback list
          content:
            application/json:
              example:
                success: true
                message: "All feedback results"
                total: 100
                page: 1
                data: []

  /feedback/search-by-department:
    get:
      tags: [AMOS - Feedback]
      summary: "Search feedback by department with date range"
      description: "Query feedback by department_id with optional from and to date filters"
      operationId: searchByDepartment
      parameters:
        - name: department_id
          in: query
          required: true
          schema:
            type: string
          example: "DEPT-001"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-01"
          description: "Start date (YYYY-MM-DD)"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2024-12-31"
          description: "End date (YYYY-MM-DD)"
      responses:
        '200':
          description: Feedback search results
          content:
            application/json:
              example:
                success: true
                message: "Feedback search results"
                total: 10
                data: []
        '400':
          description: Invalid parameters

  /feedback/{id}:
    get:
      tags: [AMOS - Feedback]
      summary: "Get feedback by ID"
      description: "Retrieve a single feedback by MongoDB _id"
      operationId: getFeedbackById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200':
          description: Feedback details
          content:
            application/json:
              example:
                success: true
                message: "Feedback details"
                data: {}
        '400':
          description: Invalid ID format
        '404':
          description: Feedback not found

    delete:
      tags: [AMOS - Feedback]
      summary: "Delete feedback by ID"
      description: "Delete a feedback record by MongoDB _id"
      operationId: deleteFeedback
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200':
          description: Feedback deleted successfully
          content:
            application/json:
              example:
                success: true
                message: "Feedback deleted successfully"
        '400':
          description: Invalid ID format
        '404':
          description: Feedback not found

  # ═══════════════════════════════════════════════════════
  # PARFAIT - DEPARTMENTS
  # ═══════════════════════════════════════════════════════

  /department/crud:
    get:
      tags: [PARFAIT - Departments]
      summary: "List All Departments"
      operationId: listAllDepartments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

    post:
      tags: [PARFAIT - Departments]
      summary: "Create Department"
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_name, department_id, department_response_time_in_minutes]
              properties:
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                department_leader: { type: string, example: "Jane@gmail.com" }
                department_response_time_in_minutes: { type: integer, example: 5 }
      responses:
        '201': { description: Created }
        '400': { description: Missing required fields }
        '409': { description: department_id already exists }
        '500': { description: Server error }

  /department/crud/search:
    get:
      tags: [PARFAIT - Departments]
      summary: "Search Departments"
      operationId: searchDepartments
      description: "Searches across department_name and department_id fields (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /department/crud/leader/{email}:
    get:
      tags: [PARFAIT - Departments]
      summary: "Get Departments by Leader Email"
      operationId: getDepartmentsByLeaderEmail
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
          example: "jane@gmail.com"
      responses:
        '200': { description: OK }
        '404': { description: Not found }
        '500': { description: Server error }

  /department/crud/{department_id}:
    get:
      tags: [PARFAIT - Departments]
      summary: "Get Department by department_id"
      operationId: getDepartmentById
      parameters:
        - name: department_id
          in: path
          required: true
          schema: { type: string }
          example: "DEPT-001"
      responses:
        '200': { description: Found }
        '404': { description: Not found }
        '500': { description: Server error }

  /department/crud/{id}:
    put:
      tags: [PARFAIT - Departments]
      summary: "Update Department by MongoDB _id"
      operationId: updateDepartment
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_response_time_in_minutes, department_leader]
              properties:
                department_response_time_in_minutes: { type: integer, example: 5 }
                department_leader: { type: string, example: "Jane@gmail.com" }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ObjectId or missing fields }
        '404': { description: Not found }
        '500': { description: Server error }

    delete:
      tags: [PARFAIT - Departments]
      summary: "Delete Department by MongoDB _id"
      operationId: deleteDepartment
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid ObjectId }
        '404': { description: Not found }
        '500': { description: Server error }

  # ═══════════════════════════════════════════════════════
  # PARFAIT - EMPLOYEES
  # ═══════════════════════════════════════════════════════

  /employee/crud:
    get:
      tags: [PARFAIT - Employees]
      summary: "List All Employees"
      operationId: listAllEmployees
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

    post:
      tags: [PARFAIT - Employees]
      summary: "Create Employee"
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, telephone]
              properties:
                full_name: { type: string, example: "Alice Uwimana" }
                telephone: { type: string, example: "+250788123456" }
                email: { type: string, example: "alice.uwimana@cok.gov.rw" }
                identification: { type: object, example: { type: "National ID", number: "123456789" } }
                gender: { type: string, example: "Female" }
                title: { type: string, example: "Ms." }
                department_id: { type: string, example: "669efcbb56d78e89c7a" }
      responses:
        '201': { description: Created }
        '400': { description: Missing required fields }
        '409': { description: Email or telephone already exists }
        '500': { description: Server error }

  /employee/crud/search:
    get:
      tags: [PARFAIT - Employees]
      summary: "Search Employees"
      operationId: searchEmployees
      description: "Searches across full_name, telephone, email, and title fields (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /employee/crud/by-department:
    get:
      tags: [PARFAIT - Employees]
