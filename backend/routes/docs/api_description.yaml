  # ═══════════════════════════════════════════════════════
  # PARFAIT - SYSTEM PERMISSIONS
  # ═══════════════════════════════════════════════════════

  /permissions:
    get:
      tags: [PARFAIT - System Permissions]
      summary: "List all permissions"
      operationId: listPermissions
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Permissions list returned }
        '500': { description: Server error }

  /permissions/resource/{resource}:
    get:
      tags: [PARFAIT - System Permissions]
      summary: "Get permissions for a resource"
      operationId: getResourcePermissions
      parameters:
        - name: resource
          in: path
          required: true
          schema: { type: string }
          example: "employees"
      responses:
        '200': { description: Resource permissions retrieved }
        '400': { description: Invalid resource }
        '404': { description: Resource not found }
        '500': { description: Server error }

  /permissions/user/{id}/assign:
    post:
      tags: [PARFAIT - System Permissions]
      summary: "Assign permissions to a user"
      operationId: assignPermissions
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, actions]
              properties:
                resource: { type: string, example: "employees" }
                actions: { type: array, items: { type: string }, example: ["create:employees", "update:employees"] }
      responses:
        '200': { description: Permissions assigned }
        '400': { description: Invalid input }
        '404': { description: User not found }
        '500': { description: Server error }

  /permissions/user/{id}/remove:
    post:
      tags: [PARFAIT - System Permissions]
      summary: "Remove permissions from a user"
      operationId: removePermissions
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource]
              properties:
                resource: { type: string, example: "employees" }
                actions:
                  type: array
                  items:
                    type: string
                  example: ["create:employees"]
      responses:
        '200': { description: Permissions removed }
        '400': { description: Invalid input }
        '404': { description: User not found or permission not found }
        '500': { description: Server error }