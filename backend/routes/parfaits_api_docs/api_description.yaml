openapi: 3.0.3

info:
  title: PARFAIT'S API
  version: "1.0.0"

servers:
  - url: http://localhost:2026/cok/api
    description: Local
  - url: https://cok-bc.onrender.com/cok/api
    description: Production

tags:
  - name: Departments
  - name: Employees

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MongoObjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: "64f1a2b3c4d5e6f7a8b9c0d1"

    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }

    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 10 }

security:
  - BearerAuth: []

paths:

  /department/crud:
    get:
      tags: [Departments]
      summary: "[TEST 1] List All Departments"
      operationId: listAllDepartments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

    post:
      tags: [Departments]
      summary: "[TEST 2] Create Department"
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_name, department_id]
              properties:
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                department_leader: { type: string, example: "Jane Doe" }
                total_employees: { type: integer, example: 0 }
          multipart/form-data:
            schema:
              type: object
              properties:
                department_name: { type: string }
                department_id: { type: string }
                department_leader: { type: string }
                total_employees: { type: integer }
      responses:
        '201': { description: Created }
        '400': { description: Missing required fields }
        '409': { description: department_id already exists }
        '500': { description: Server error }

  /department/crud/{department_id}:
    get:
      tags: [Departments]
      summary: "[TEST 3] Get Department by department_id"
      operationId: getDepartmentById
      parameters:
        - name: department_id
          in: path
          required: true
          schema: { type: string }
          example: "DEPT-001"
      responses:
        '200': { description: Found }
        '404': { description: Not found }
        '500': { description: Server error }

  /department/crud/{id}:
    put:
      tags: [Departments]
      summary: "[TEST 4] Update Department by MongoDB _id"
      operationId: updateDepartment
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_name, department_id, department_leader, total_employees]
              properties:
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                department_leader: { type: string, example: "Jane Doe" }
                total_employees: { type: integer, example: 10 }
          multipart/form-data:
            schema:
              type: object
              properties:
                department_name: { type: string }
                department_id: { type: string }
                department_leader: { type: string }
                total_employees: { type: integer }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ObjectId or missing fields }
        '404': { description: Not found }
        '500': { description: Server error }

    delete:
      tags: [Departments]
      summary: "[TEST 5] Delete Department by MongoDB _id"
      operationId: deleteDepartment
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid ObjectId }
        '404': { description: Not found }
        '500': { description: Server error }

  /employee/crud:
    get:
      tags: [Employees]
      summary: "[TEST 6] List All Employees"
      operationId: listAllEmployees
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

    post:
      tags: [Employees]
      summary: "[TEST 7] Create Employee"
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, telephone, email]
              properties:
                full_name: { type: string, example: "Alice Uwimana" }
                telephone: { type: string, example: "+250788123456" }
                email: { type: string, example: "alice.uwimana@cok.gov.rw" }
                gender: { type: string, example: "Female" }
                title: { type: string, example: "Ms." }
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                identification:
                  type: object
                  properties:
                    id_type: { type: string, example: "National ID" }
                    number: { type: string, example: "1199880077665544" }
                roles:
                  type: object
                  properties:
                    role_name: { type: string, example: "HR Manager" }
                    permissions: { type: array, items: { type: string }, example: ["read:employees"] }
          multipart/form-data:
            schema:
              type: object
              properties:
                full_name: { type: string }
                telephone: { type: string }
                email: { type: string }
                gender: { type: string }
                title: { type: string }
                department_name: { type: string }
                department_id: { type: string }
      responses:
        '201': { description: Created — activation required }
        '400': { description: Missing required fields }
        '409': { description: Email or telephone already exists }
        '500': { description: Server error }

  /employee/crud/{id}:
    get:
      tags: [Employees]
      summary: "[TEST 8] Get Employee by MongoDB _id"
      operationId: getEmployeeById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Found }
        '404': { description: Not found }
        '500': { description: Server error }

    put:
      tags: [Employees]
      summary: "[TEST 9] Update Employee by MongoDB _id"
      operationId: updateEmployee
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, example: "Alice Uwimana" }
                telephone: { type: string, example: "+250788123456" }
                email: { type: string, example: "alice.uwimana@cok.gov.rw" }
                gender: { type: string, example: "Female" }
                title: { type: string, example: "Ms." }
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                identification:
                  type: object
                  properties:
                    id_type: { type: string, example: "National ID" }
                    number: { type: string, example: "1199880077665544" }
                access_control:
                  type: object
                  properties:
                    is_locked: { type: boolean, example: false }
                    reason: { type: string, example: "Suspicious activity" }
                roles:
                  type: object
                  properties:
                    role_name: { type: string, example: "HR Manager" }
                    permissions: { type: array, items: { type: string }, example: ["read:employees"] }
          multipart/form-data:
            schema:
              type: object
              properties:
                full_name: { type: string }
                telephone: { type: string }
                email: { type: string }
                gender: { type: string }
                title: { type: string }
                department_name: { type: string }
                department_id: { type: string }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ObjectId }
        '404': { description: Not found }
        '409': { description: Email or telephone conflict }
        '500': { description: Server error }

    delete:
      tags: [Employees]
      summary: "[TEST 10] Delete Employee by MongoDB _id"
      operationId: deleteEmployee
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid ObjectId }
        '403': { description: Cannot delete own account }
        '404': { description: Not found or already deleted }
        '500': { description: Server error }