openapi: 3.0.3

info:
  title: PARFAIT'S API (FIRST CHOOSE A SERVER BEFORE TESTING ENDPOINTS)
  version: "1.0.0"

servers:
  - url: http://localhost:2026/cok/api
    description: Local
  - url: https://cok-bc.onrender.com/cok/api
    description: Production

tags:
  - name: Departments
  - name: Employees
  - name: Visitors
  - name: Vehicles

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MongoObjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: "64f1a2b3c4d5e6f7a8b9c0d1"

    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }

    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 10 }

    QueryParam:
      name: query
      in: query
      schema: { type: string, default: "" }
      description: "Search keyword (case-insensitive)"

security:
  - BearerAuth: []

paths:

  # ─────────────────────────────────────────
  # DEPARTMENTS
  # ─────────────────────────────────────────

  /department/crud:
    get:
      tags: [Departments]
      summary: "[TEST 1] List All Departments"
      operationId: listAllDepartments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

    post:
      tags: [Departments]
      summary: "[TEST 2] Create Department"
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_name, department_id]
              properties:
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                department_leader: { type: string, example: "Jane Doe" }
                total_employees: { type: integer, example: 0 }
          multipart/form-data:
            schema:
              type: object
              properties:
                department_name: { type: string }
                department_id: { type: string }
                department_leader: { type: string }
                total_employees: { type: integer }
      responses:
        '201': { description: Created }
        '400': { description: Missing required fields }
        '409': { description: department_id already exists }
        '500': { description: Server error }

  /department/crud/search:
    get:
      tags: [Departments]
      summary: "[TEST 3] Search Departments"
      operationId: searchDepartments
      description: "Searches across department_name and department_id fields (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /department/crud/{department_id}:
    get:
      tags: [Departments]
      summary: "[TEST 4] Get Department by department_id"
      operationId: getDepartmentById
      parameters:
        - name: department_id
          in: path
          required: true
          schema: { type: string }
          example: "DEPT-001"
      responses:
        '200': { description: Found }
        '404': { description: Not found }
        '500': { description: Server error }

  /department/crud/{id}:
    put:
      tags: [Departments]
      summary: "[TEST 5] Update Department by MongoDB _id"
      operationId: updateDepartment
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_name, department_id, department_leader, total_employees]
              properties:
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                department_leader: { type: string, example: "Jane Doe" }
                total_employees: { type: integer, example: 10 }
          multipart/form-data:
            schema:
              type: object
              properties:
                department_name: { type: string }
                department_id: { type: string }
                department_leader: { type: string }
                total_employees: { type: integer }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ObjectId or missing fields }
        '404': { description: Not found }
        '500': { description: Server error }

    delete:
      tags: [Departments]
      summary: "[TEST 6] Delete Department by MongoDB _id"
      operationId: deleteDepartment
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid ObjectId }
        '404': { description: Not found }
        '500': { description: Server error }

  # ─────────────────────────────────────────
  # EMPLOYEES
  # ─────────────────────────────────────────

  /employee/crud:
    get:
      tags: [Employees]
      summary: "[TEST 7] List All Employees"
      operationId: listAllEmployees
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

    post:
      tags: [Employees]
      summary: "[TEST 8] Create Employee"
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, telephone, email]
              properties:
                full_name: { type: string, example: "Alice Uwimana" }
                telephone: { type: string, example: "+250788123456" }
                email: { type: string, example: "alice.uwimana@cok.gov.rw" }
                gender: { type: string, example: "Female" }
                title: { type: string, example: "Ms." }
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                identification:
                  type: object
                  properties:
                    id_type: { type: string, example: "National ID" }
                    number: { type: string, example: "1199880077665544" }
                roles:
                  type: object
                  properties:
                    role_name: { type: string, example: "HR Manager" }
                    permissions: { type: array, items: { type: string }, example: ["read:employees"] }
          multipart/form-data:
            schema:
              type: object
              properties:
                full_name: { type: string }
                telephone: { type: string }
                email: { type: string }
                gender: { type: string }
                title: { type: string }
                department_name: { type: string }
                department_id: { type: string }
      responses:
        '201': { description: Created — activation required }
        '400': { description: Missing required fields }
        '409': { description: Email or telephone already exists }
        '500': { description: Server error }

  /employee/crud/search:
    get:
      tags: [Employees]
      summary: "[TEST 9] Search Employees"
      operationId: searchEmployees
      description: "Searches across full_name, telephone, email, and title fields (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /employee/crud/{id}:
    get:
      tags: [Employees]
      summary: "[TEST 10] Get Employee by MongoDB _id"
      operationId: getEmployeeById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Found }
        '404': { description: Not found }
        '500': { description: Server error }

    put:
      tags: [Employees]
      summary: "[TEST 11] Update Employee by MongoDB _id"
      operationId: updateEmployee
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, example: "Alice Uwimana" }
                telephone: { type: string, example: "+250788123456" }
                email: { type: string, example: "alice.uwimana@cok.gov.rw" }
                gender: { type: string, example: "Female" }
                title: { type: string, example: "Ms." }
                department_name: { type: string, example: "Human Resources" }
                department_id: { type: string, example: "DEPT-001" }
                identification:
                  type: object
                  properties:
                    id_type: { type: string, example: "National ID" }
                    number: { type: string, example: "1199880077665544" }
                access_control:
                  type: object
                  properties:
                    is_locked: { type: boolean, example: false }
                    reason: { type: string, example: "Suspicious activity" }
                roles:
                  type: object
                  properties:
                    role_name: { type: string, example: "HR Manager" }
                    permissions: { type: array, items: { type: string }, example: ["read:employees"] }
          multipart/form-data:
            schema:
              type: object
              properties:
                full_name: { type: string }
                telephone: { type: string }
                email: { type: string }
                gender: { type: string }
                title: { type: string }
                department_name: { type: string }
                department_id: { type: string }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ObjectId }
        '404': { description: Not found }
        '409': { description: Email or telephone conflict }
        '500': { description: Server error }

    delete:
      tags: [Employees]
      summary: "[TEST 12] Delete Employee by MongoDB _id"
      operationId: deleteEmployee
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid ObjectId }
        '403': { description: Cannot delete own account }
        '404': { description: Not found or already deleted }
        '500': { description: Server error }

  # ─────────────────────────────────────────
  # VISITORS  (base: /servicedelivery/visitor)
  # ─────────────────────────────────────────

  /servicedelivery/visitor:
    get:
      tags: [Visitors]
      summary: "[TEST 13] List All Visitors"
      operationId: listVisitors
      description: "Filter by in_house status. Default returns only visitors currently in-house."
      parameters:
        - name: in_house
          in: query
          schema: { type: boolean, default: true }
          description: "true = currently in-house, false = already left"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

  /servicedelivery/visitor/search:
    get:
      tags: [Visitors]
      summary: "[TEST 14] Search Visitors"
      operationId: searchVisitors
      description: "Searches across full_name, telephone, identification.number, and plate_number (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - name: in_house
          in: query
          schema: { type: boolean }
          description: "Optionally filter by in-house status"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /servicedelivery/visitor/checkin:
    post:
      tags: [Visitors]
      summary: "[TEST 15] Visitor Check-In"
      operationId: visitorCheckin
      description: "Registers a new visitor. If they have a vehicle, links to an active parking record automatically."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string, example: "Jean Pierre Habimana" }
                telephone: { type: string, example: "+250788000111" }
                email: { type: string, example: "jean@example.com" }
                gender: { type: string, example: "Male" }
                identification:
                  type: object
                  properties:
                    id_type: { type: string, example: "National ID" }
                    number: { type: string, example: "1198800112233445" }
                vehicle_storage:
                  type: object
                  properties:
                    has_vehicle: { type: boolean, example: true }
                    vehicle_details:
                      type: object
                      properties:
                        plate_number: { type: string, example: "RAC123A" }
                items_entered_with:
                  type: array
                  items:
                    type: object
                    properties:
                      item_name: { type: string, example: "Laptop" }
                      quantity: { type: integer, example: 1 }
                departments_assigned:
                  type: array
                  items: { type: object }
                services_status:
                  type: array
                  items: { type: object }
      responses:
        '201': { description: Visitor checked in successfully }
        '400': { description: full_name is required }
        '500': { description: Server error }

  /servicedelivery/visitor/assign:
    post:
      tags: [Visitors]
      summary: "[TEST 16] Assign Visitor to Department"
      operationId: assignVisitorToDepartment
      description: "Assigns an in-house visitor to a new department. Optionally closes the previous department's service and logs duration."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, new_department_id, new_department_name]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                new_department_id: { type: string, example: "DEPT-002" }
                new_department_name: { type: string, example: "Finance" }
                provider_name: { type: string, example: "John Doe" }
                provider_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d2" }
                previous_department_id: { type: string, example: "DEPT-001" }
      responses:
        '200': { description: Visitor assigned to new department }
        '400': { description: Missing required fields or invalid visitor_id format }
        '404': { description: Visitor not found or already left }
        '500': { description: Server error }

  /servicedelivery/visitor/checkout:
    post:
      tags: [Visitors]
      summary: "[TEST 17] Visitor Check-Out"
      operationId: visitorCheckout
      description: "Checks out a visitor. If they have a car still parked, sets status to pending until vehicle exits."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                items_exited_with:
                  type: array
                  items:
                    type: object
                    properties:
                      item_name: { type: string, example: "Laptop" }
                      quantity: { type: integer, example: 1 }
      responses:
        '200': { description: Visitor checked out or marked pending (car still parked) }
        '400': { description: visitor_id is required }
        '404': { description: Visitor not found or already checked out }
        '500': { description: Server error }

  /servicedelivery/visitor/service/status:
    post:
      tags: [Visitors]
      summary: "[TEST 18] Toggle Service Status"
      operationId: toggleServiceStatus
      description: "Updates a visitor's department service status to 'Inprogress' or 'Completed'. Logs duration when completed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, department_id, status]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                department_id: { type: string, example: "DEPT-001" }
                status:
                  type: string
                  enum: [Inprogress, Completed]
                  example: "Inprogress"
      responses:
        '200': { description: Service status updated }
        '400': { description: Missing fields or invalid status value }
        '404': { description: Visitor not found or no active service for that department }
        '500': { description: Server error }

  /servicedelivery/visitor/emergency/leave-return:
    post:
      tags: [Visitors]
      summary: "[TEST 19] Toggle Temporary Leave / Return"
      operationId: toggleTemporaryLeave
      description: "Marks a visitor as temporarily outside ('leave') or returned ('return'). Tracks duration and optionally logs items taken out."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id, action]
              properties:
                visitor_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d1" }
                action:
                  type: string
                  enum: [leave, return]
                  example: "leave"
                items_exited_with:
                  type: array
                  items:
                    type: object
                    properties:
                      item_name: { type: string, example: "Laptop" }
                      quantity: { type: integer, example: 1 }
                provider_name: { type: string, example: "Jane Doe" }
                provider_id: { type: string, example: "64f1a2b3c4d5e6f7a8b9c0d2" }
                message: { type: string, example: "Visitor went to get documents from car" }
      responses:
        '200': { description: Visitor marked as outside or returned }
        '400': { description: Missing fields, already outside, or no active leave record to close }
        '404': { description: Visitor not found or not in-house }
        '500': { description: Server error }

  /servicedelivery/visitor/{id}:
    get:
      tags: [Visitors]
      summary: "[TEST 20] Get Visitor by MongoDB _id"
      operationId: getVisitorById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Visitor details returned }
        '400': { description: Invalid ObjectId format }
        '404': { description: Visitor not found }
        '500': { description: Server error }

  # ─────────────────────────────────────────
  # VEHICLES  (base: /smartparking/vehicle)
  # ─────────────────────────────────────────

  /smartparking/vehicle:
    get:
      tags: [Vehicles]
      summary: "[TEST 21] List Parking Records"
      operationId: listParkingRecords
      description: "Filter by status. Default returns all records."
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed]
            default: active
          description: "Filter by parking status"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }
        '500': { description: Server error }

  /smartparking/vehicle/search:
    get:
      tags: [Vehicles]
      summary: "[TEST 22] Search Parking Records"
      operationId: searchParkingRecords
      description: "Searches across plate_number, driver_name, and driver_identification.number (case-insensitive)."
      parameters:
        - $ref: '#/components/parameters/QueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Search results returned }
        '500': { description: Server error }

  /smartparking/vehicle/flagged:
    get:
      tags: [Vehicles]
      summary: "[TEST 23] List Flagged Vehicles"
      operationId: listFlaggedCars
      description: "Returns only vehicles marked as flagged. Filter by status (active or completed)."
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed]
            default: active
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Flagged vehicle records returned }
        '500': { description: Server error }

  /smartparking/vehicle/verify:
    post:
      tags: [Vehicles]
      summary: "[TEST 24] Verify a Vehicle"
      operationId: verifyVehicle
      description: "Checks if a plate number belongs to a Staff or Visitor (Emergency) car, and whether it is currently parked."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate_number]
              properties:
                plate_number: { type: string, example: "RAC123A" }
      responses:
        '200': { description: Vehicle verification result with parking status, category, and details }
        '400': { description: plate_number is required }
        '500': { description: Server error }

  /smartparking/vehicle/checkin:
    post:
      tags: [Vehicles]
      summary: "[TEST 25] Vehicle Check-In"
      operationId: vehicleCheckin
      description: "Creates an active parking record. Auto-fills driver details from StaffCar, EmergencyCar, or ServiceDelivery if found."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate_number]
              properties:
                plate_number: { type: string, example: "RAC123A" }
                driver_identification:
                  type: object
                  properties:
                    id_type: { type: string, example: "National ID" }
                    number: { type: string, example: "1199880077665544" }
      responses:
        '201': { description: Car checked in successfully }
        '400': { description: plate_number is required }
        '409': { description: Car already has an active parking session }
        '500': { description: Server error }

  /smartparking/vehicle/checkout:
    post:
      tags: [Vehicles]
      summary: "[TEST 26] Vehicle Check-Out"
      operationId: vehicleCheckout
      description: "Closes the active parking session for a plate number. If linked to a visitor who requested checkout, marks that visitor as fully checked out."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate_number]
              properties:
                plate_number: { type: string, example: "RAC123A" }
      responses:
        '200': { description: Car checked out (and optionally associated visitor fully checked out) }
        '400': { description: plate_number is required }
        '404': { description: No active parking record found for this plate number }
        '500': { description: Server error }

  /smartparking/vehicle/{id}:
    get:
      tags: [Vehicles]
      summary: "[TEST 27] Get Parking Record by MongoDB _id"
      operationId: getParkingRecordById
      parameters:
        - $ref: '#/components/parameters/MongoObjectId'
      responses:
        '200': { description: Parking record details returned }
        '400': { description: Invalid ObjectId format }
        '404': { description: Parking record not found }
        '500': { description: Server error }