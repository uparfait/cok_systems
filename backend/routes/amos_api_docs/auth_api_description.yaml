openapi: 3.0.3

info:
  title: AMOS AUTH API
  version: "1.0.0"
servers:
  - url: https://cok-bc.onrender.com/cok/api
    description: Production Test
  - url: http://localhost:2026/cok/api
    description: Local Test

tags:
  - name: Authentication
  - name: First-Time Login
  - name: Password Reset
  - name: Account Lock

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MongoObjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: "64f1a2b3c4d5e6f7a8b9c0d1"

security:
  - BearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Authentication]
      summary: "Login - Step 1: Verify credentials and send OTP"
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: OTP sent successfully }
        '400': { description: Missing required fields }
        '401': { description: Invalid credentials }
        '403': { description: Account not activated or locked }

  /auth/login/verify:
    post:
      tags: [Authentication]
      summary: "Login - Step 2: Verify OTP and get JWT token"
      operationId: verifyLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp]
              properties:
                userId: { type: string }
                otp: { type: string }
      responses:
        '200': { description: Login successful }
        '400': { description: Invalid or expired OTP }

  /auth/login/resend:
    post:
      tags: [Authentication]
      summary: "Resend OTP for login"
      operationId: resendLoginOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
      responses:
        '200': { description: OTP resent successfully }
        '400': { description: User ID and email required }
        '403': { description: Account is locked }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: "Logout from current device"
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200': { description: Logged out successfully }

  /auth/logout/all:
    post:
      tags: [Authentication]
      summary: "Logout from all devices"
      operationId: logoutAll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Logged out from all devices }

  /auth/first-login/check:
    post:
      tags: [First-Time Login]
      summary: "Check if account needs activation"
      operationId: checkEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200': { description: Account found, can proceed }
        '400': { description: Account already activated }
        '403': { description: Account is locked }
        '404': { description: Account not found }

  /auth/first-login/send-otp:
    post:
      tags: [First-Time Login]
      summary: "Send OTP for account activation"
      operationId: sendActivationOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200': { description: OTP sent successfully }
        '400': { description: Account already activated }
        '403': { description: Account is locked }

  /auth/first-login/activate:
    post:
      tags: [First-Time Login]
      summary: "Activate account with OTP and set password"
      operationId: activateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp, newPassword, confirmPassword]
              properties:
                userId: { type: string }
                otp: { type: string }
                newPassword: { type: string }
                confirmPassword: { type: string }
      responses:
        '200': { description: Account activated successfully }
        '400': { description: Invalid OTP or password }
        '403': { description: Account is locked }

  /auth/first-login/resend:
    post:
      tags: [First-Time Login]
      summary: "Resend activation OTP"
      operationId: resendActivationOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
      responses:
        '200': { description: OTP resent successfully }
        '403': { description: Account is locked }

  /auth/password-reset:
    post:
      tags: [Password Reset]
      summary: "Request password reset - send OTP"
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200': { description: OTP sent }
        '403': { description: Account is locked }

  /auth/password-reset/verify:
    post:
      tags: [Password Reset]
      summary: "Verify OTP for password reset"
      operationId: verifyPasswordResetOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp]
              properties:
                userId: { type: string }
                otp: { type: string }
      responses:
        '200': { description: OTP verified }
        '400': { description: Invalid or expired OTP }

  /auth/password-reset/reset:
    post:
      tags: [Password Reset]
      summary: "Reset password with temp token"
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, tempToken, newPassword]
              properties:
                userId: { type: string }
                tempToken: { type: string }
                newPassword: { type: string }
      responses:
        '200': { description: Password reset successfully }
        '400': { description: Invalid or expired token }

  /auth/password-reset/resend:
    post:
      tags: [Password Reset]
      summary: "Resend password reset OTP"
      operationId: resendPasswordResetOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email]
              properties:
                userId: { type: string }
                email: { type: string }
      responses:
        '200': { description: OTP resent successfully }
        '403': { description: Account is locked }

  /auth/lock-unlock:
    post:
      tags: [Account Lock]
      summary: "Lock or unlock a user account"
      operationId: lockUnlockAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, action]
              properties:
                userId: { type: string }
                action: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Account locked/unlocked }
        '400': { description: Invalid action }
        '404': { description: User not found }

  /auth/lock-unlock/status:
    post:
      tags: [Account Lock]
      summary: "Check account lock status"
      operationId: checkLockStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Lock status retrieved }
        '404': { description: User not found }

  /auth/lock-unlock/reset-attempts:
    post:
      tags: [Account Lock]
      summary: "Reset login attempts for a user"
      operationId: resetLoginAttempts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Login attempts reset }
        '404': { description: User not found }
