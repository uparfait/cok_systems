<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keep Moving — Sunset Ride</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0e08; }
  #scene { position: fixed; inset: 0; display: block; }

  /* Quote panel — top-right quadrant */
  .quote-panel {
    position: fixed;
    top: 7vh;
    right: 5vw;
    max-width: min(420px, 82vw);
    padding: 30px 34px 26px;
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255, 157, 0, 0.22);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: center;
    color: #ffffff;
    font-family: Georgia, 'Times New Roman', serif;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    animation: panelIn 1.6s cubic-bezier(.2,.7,.2,1) both;
    z-index: 10;
  }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .quote-panel .rule {
    width: 46px; height: 1px; margin: 0 auto 16px;
    background: linear-gradient(90deg, transparent, #FF9D00, transparent);
  }
  .quote-panel blockquote {
    font-size: clamp(1.05rem, 2.2vw, 1.35rem);
    line-height: 1.55;
    font-style: italic;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .quote-panel cite {
    display: block;
    margin-top: 14px;
    font-style: normal;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 200, 130, 0.85);
  }

  .hint {
    position: fixed;
    left: 50%; bottom: 3.5vh;
    transform: translateX(-50%);
    font-family: Georgia, serif;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255, 220, 180, 0.55);
    z-index: 10;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .quote-panel { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="quote-panel">
  <div class="rule"></div>
  <blockquote>&ldquo;Life is like riding a bicycle. To keep your balance, you must keep moving.&rdquo;</blockquote>
  <cite>Albert Einstein</cite>
</div>
<div class="hint">Camera circles the rider &mdash; move your mouse to drift</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Renderer ----------
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x8a4a1e, 0.016);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);

  // ---------- Sky dome (sunset gradient shader) ----------
  const skyGeo = new THREE.SphereGeometry(180, 32, 24);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor:     { value: new THREE.Color(0x4a2c22) },  // warm cloud brown
      midColor:     { value: new THREE.Color(0xb85c1e) },  // burnt amber band
      horizonColor: { value: new THREE.Color(0xFF9D00) },  // golden orange
      bottomColor:  { value: new THREE.Color(0x241209) },  // dark ground haze
      sunDir:       { value: new THREE.Vector3() },
      sunColor:     { value: new THREE.Color(0xffd9a0) }
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 topColor, midColor, horizonColor, bottomColor, sunDir, sunColor;
      void main() {
        float h = vDir.y;
        vec3 col;
        if (h < 0.0) {
          col = mix(horizonColor * 0.55, bottomColor, smoothstep(0.0, -0.25, h));
        } else {
          vec3 lower = mix(horizonColor, midColor, smoothstep(0.0, 0.22, h));
          col = mix(lower, topColor, smoothstep(0.18, 0.65, h));
        }
        // Sun glow + disc
        float s = max(dot(vDir, normalize(sunDir)), 0.0);
        col += sunColor * pow(s, 60.0) * 1.4;   // halo
        col += vec3(1.0, 0.87, 0.6) * smoothstep(0.9993, 0.9997, s) * 5.0; // disc
        // faint band of cloud streaks
        float streak = sin(vDir.y * 42.0 + vDir.x * 6.0) * 0.5 + 0.5;
        col *= 1.0 - streak * 0.06 * smoothstep(0.05, 0.35, h) * smoothstep(0.6, 0.3, h);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // ---------- Lights ----------
  const sunDirection = new THREE.Vector3(-0.55, 0.14, -0.82).normalize();
  skyMat.uniforms.sunDir.value.copy(sunDirection);

  const sun = new THREE.DirectionalLight(0xffb45e, 2.4);
  sun.position.copy(sunDirection).multiplyScalar(60);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
  sun.shadow.camera.top = 14;   sun.shadow.camera.bottom = -14;
  sun.shadow.camera.near = 10;  sun.shadow.camera.far = 130;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  scene.add(new THREE.HemisphereLight(0xcc7733, 0x1d0f08, 0.55));
  const rim = new THREE.DirectionalLight(0xff7733, 0.5);
  rim.position.set(6, 4, 8);
  scene.add(rim);

  // ---------- Asphalt ground (glossy, semi-transparent so mirror reflection reads) ----------
  const asphaltTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#181513'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 2600; i++) {
      const v = 18 + Math.random() * 34;
      g.fillStyle = `rgba(${v},${v * 0.96},${v * 0.9},0.5)`;
      g.fillRect(Math.random() * 256, Math.random() * 256, 1.4, 1.4);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(46, 46);
    return t;
  })();

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshStandardMaterial({
      map: asphaltTex,
      color: 0x9a8a7c,
      roughness: 0.32,
      metalness: 0.55,
      transparent: true,
      opacity: 0.88
    })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Sun glare streak on the wet-look asphalt
  const glare = new THREE.Mesh(
    new THREE.PlaneGeometry(4.5, 90),
    new THREE.MeshBasicMaterial({
      color: 0xff9d00, transparent: true, opacity: 0.14,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  glare.rotation.x = -Math.PI / 2;
  glare.position.y = 0.012;
  glare.lookAt(sunDirection.clone().setY(0).multiplyScalar(100));
  glare.rotateX(-Math.PI / 2);
  scene.add(glare);

  // ---------- Road lane dashes (scrolling => illusion of speed) ----------
  const dashes = [];
  const dashMat = new THREE.MeshStandardMaterial({ color: 0xd8c9a8, roughness: 0.8, emissive: 0x332b1a, emissiveIntensity: 0.4 });
  for (const laneX of [-2.6, 2.6]) {
    for (let i = 0; i < 26; i++) {
      const d = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.015, 1.7), dashMat);
      d.position.set(laneX, 0.01, -70 + i * 5.5);
      scene.add(d);
      dashes.push(d);
    }
  }

  // Roadside posts flying by for extra motion parallax
  const posts = [];
  const postMat = new THREE.MeshStandardMaterial({ color: 0x3a2c22, roughness: 0.9 });
  for (const side of [-9, 9]) {
    for (let i = 0; i < 10; i++) {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1.1, 6), postMat);
      p.position.set(side + (Math.random() - 0.5), 0.55, -70 + i * 14 + Math.random() * 4);
      p.castShadow = true;
      scene.add(p);
      posts.push(p);
    }
  }

  // ---------- Materials for the bike ----------
  const paint  = new THREE.MeshStandardMaterial({ color: 0x6e1414, roughness: 0.28, metalness: 0.6 });
  const black  = new THREE.MeshStandardMaterial({ color: 0x14100e, roughness: 0.55, metalness: 0.35 });
  const chrome = new THREE.MeshStandardMaterial({ color: 0xd9cfc2, roughness: 0.15, metalness: 1.0 });
  const rubber = new THREE.MeshStandardMaterial({ color: 0x0c0b0a, roughness: 0.95 });
  const leather= new THREE.MeshStandardMaterial({ color: 0x241a12, roughness: 0.8 });
  const jacket = new THREE.MeshStandardMaterial({ color: 0x2a2320, roughness: 0.7 });
  const brakeMat = new THREE.MeshStandardMaterial({
    color: 0x330000, emissive: 0xff1a0a, emissiveIntensity: 4.0, roughness: 0.4
  });
  const headMat = new THREE.MeshStandardMaterial({
    color: 0x554422, emissive: 0xffdd99, emissiveIntensity: 2.2, roughness: 0.4
  });

  function shadowed(mesh) { mesh.castShadow = true; return mesh; }

  // ---------- Low-poly motorcycle + rider ----------
  const bike = new THREE.Group();          // faces -Z (riding into the sunset)
  scene.add(bike);

  const wheelGeo = new THREE.TorusGeometry(0.36, 0.115, 10, 22);
  const hubGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.09, 12);

  function makeWheel(z) {
    const w = new THREE.Group();
    w.add(shadowed(new THREE.Mesh(wheelGeo, rubber)));
    const hub = shadowed(new THREE.Mesh(hubGeo, chrome));
    hub.rotation.z = Math.PI / 2;
    w.add(hub);
    for (let i = 0; i < 5; i++) {
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.62, 0.05), chrome);
      spoke.rotation.x = (i / 5) * Math.PI;
      w.add(spoke);
    }
    w.rotation.y = Math.PI / 2;              // torus in X/Y plane -> roll around X
    w.position.set(0, 0.47, z);
    bike.add(w);
    return w;
  }
  const rearWheel  = makeWheel(0.95);
  const frontWheel = makeWheel(-0.98);

  // Frame spine
  const spine = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.14, 1.5), black));
  spine.position.set(0, 0.72, 0);
  bike.add(spine);

  // Engine block
  const engine = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.4, 0.55), chrome));
  engine.position.set(0, 0.62, 0.05);
  bike.add(engine);

  // Fuel tank
  const tank = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 12), paint));
  tank.scale.set(0.72, 0.6, 1.25);
  tank.position.set(0, 0.98, -0.28);
  bike.add(tank);

  // Seat + rear cowl
  const seat = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.1, 0.62), leather));
  seat.position.set(0, 0.98, 0.32);
  bike.add(seat);
  const cowl = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.18, 0.42), paint));
  cowl.position.set(0, 1.0, 0.78);
  cowl.rotation.x = 0.28;
  bike.add(cowl);

  // Rear fender + BRAKE LIGHT (emissive red — bloom picks this up)
  const fender = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.08, 0.5), black));
  fender.position.set(0, 0.86, 1.05);
  fender.rotation.x = 0.35;
  bike.add(fender);
  const brake = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.09, 0.06), brakeMat);
  brake.position.set(0, 0.99, 1.06);
  bike.add(brake);
  const brakePoint = new THREE.PointLight(0xff2211, 1.6, 4);
  brakePoint.position.set(0, 1.0, 1.2);
  bike.add(brakePoint);

  // Front fork + handlebars + headlight
  for (const x of [-0.09, 0.09]) {
    const fork = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.85, 8), chrome));
    fork.position.set(x, 0.85, -0.92);
    fork.rotation.x = -0.42;
    bike.add(fork);
  }
  const bar = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.66, 8), black));
  bar.rotation.z = Math.PI / 2;
  bar.position.set(0, 1.22, -0.72);
  bike.add(bar);
  const headlight = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), headMat);
  headlight.position.set(0, 1.08, -1.02);
  bike.add(headlight);

  // Twin exhaust pipes
  for (const x of [-0.16, 0.16]) {
    const pipe = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.065, 1.15, 10), chrome));
    pipe.rotation.x = Math.PI / 2 - 0.1;
    pipe.position.set(x, 0.42, 0.55);
    bike.add(pipe);
  }

  // ---------- Rider ----------
  const rider = new THREE.Group();
  const hips = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.22, 0.26), jacket));
  hips.position.set(0, 1.12, 0.3);
  rider.add(hips);
  const torso = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.52, 0.24), jacket));
  torso.position.set(0, 1.38, 0.1);
  torso.rotation.x = -0.55;                  // leaned into the wind
  rider.add(torso);
  const helmet = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 12), new THREE.MeshStandardMaterial({ color: 0x87231c, roughness: 0.2, metalness: 0.5 })));
  helmet.position.set(0, 1.66, -0.14);
  rider.add(helmet);
  const visor = new THREE.Mesh(new THREE.SphereGeometry(0.135, 12, 10, -0.6, 1.2, 1.1, 0.8), black);
  visor.position.copy(helmet.position);
  rider.add(visor);
  for (const s of [-1, 1]) {
    const arm = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.5, 8), jacket));
    arm.position.set(s * 0.24, 1.4, -0.28);
    arm.rotation.x = -1.1; arm.rotation.z = s * 0.25;
    rider.add(arm);
    const thigh = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.42, 8), black));
    thigh.position.set(s * 0.19, 1.0, 0.16);
    thigh.rotation.x = 1.15;
    rider.add(thigh);
    const calf = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.4, 8), black));
    calf.position.set(s * 0.2, 0.72, 0.22);
    rider.add(calf);
  }
  bike.add(rider);

  // ---------- Fake mirror reflection on the asphalt ----------
  const reflection = bike.clone(true);
  reflection.traverse(o => {
    if (o.isMesh) {
      o.castShadow = false;
      o.material = o.material.clone();
      o.material.transparent = true;
      o.material.opacity = 0.18;
      o.material.depthWrite = false;
      if (o.material.emissiveIntensity) o.material.emissiveIntensity *= 0.6;
    }
    if (o.isLight) o.intensity = 0;
  });
  reflection.scale.y = -1;
  scene.add(reflection);

  // ---------- Smoke particle system (rear wheel) ----------
  const smokeTexture = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
    grad.addColorStop(0, 'rgba(235,225,215,0.85)');
    grad.addColorStop(0.4, 'rgba(210,195,180,0.4)');
    grad.addColorStop(1, 'rgba(180,165,150,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();

  const SMOKE_COUNT = reducedMotion ? 90 : 220;
  const sPos = new Float32Array(SMOKE_COUNT * 3);
  const sAlpha = new Float32Array(SMOKE_COUNT);
  const sSize = new Float32Array(SMOKE_COUNT);
  const sVel = [];
  const sLife = new Float32Array(SMOKE_COUNT);
  const sMaxLife = new Float32Array(SMOKE_COUNT);
  const sSeed = new Float32Array(SMOKE_COUNT);

  const emitPoint = new THREE.Vector3();
  function resetParticle(i, burst) {
    bike.localToWorld(emitPoint.set(
      (Math.random() - 0.5) * 0.3,
      0.18 + Math.random() * 0.15,
      1.05 + Math.random() * 0.25
    ));
    sPos[i * 3]     = emitPoint.x;
    sPos[i * 3 + 1] = emitPoint.y;
    sPos[i * 3 + 2] = emitPoint.z;
    sVel[i] = new THREE.Vector3(
      (Math.random() - 0.5) * 0.5,
      0.55 + Math.random() * 0.7,
      1.4 + Math.random() * 1.2          // streams backward (+Z in bike space ≈ world since bike ~static)
    );
    sMaxLife[i] = 1.6 + Math.random() * 1.8;
    sLife[i] = burst ? Math.random() * sMaxLife[i] : 0;
    sSeed[i] = Math.random() * 100;
    sSize[i] = 0.25 + Math.random() * 0.4;
    sAlpha[i] = 0;
  }
  for (let i = 0; i < SMOKE_COUNT; i++) resetParticle(i, true);

  const smokeGeo = new THREE.BufferGeometry();
  smokeGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  smokeGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sAlpha, 1));
  smokeGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));

  const smokeMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending,
    uniforms: { map: { value: smokeTexture }, tint: { value: new THREE.Color(0xcbb9a6) } },
    vertexShader: `
      attribute float aAlpha;
      attribute float aSize;
      varying float vAlpha;
      void main() {
        vAlpha = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (240.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D map;
      uniform vec3 tint;
      varying float vAlpha;
      void main() {
        vec4 tex = texture2D(map, gl_PointCoord);
        gl_FragColor = vec4(tint * tex.rgb, tex.a * vAlpha);
      }`
  });
  scene.add(new THREE.Points(smokeGeo, smokeMat));

  // ---------- Minimal custom bloom (bright-pass + gaussian blur + additive composite) ----------
  // (cdnjs hosts only the three.js core, so the composer is implemented inline.)
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quadGeo = new THREE.PlaneGeometry(2, 2);
  function makePass(fragment, uniforms) {
    const mat = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: fragment,
      depthTest: false, depthWrite: false
    });
    const sc = new THREE.Scene();
    sc.add(new THREE.Mesh(quadGeo, mat));
    return { scene: sc, mat };
  }

  const rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat };
  let rtScene, rtA, rtB;
  function buildTargets(w, h) {
    if (rtScene) { rtScene.dispose(); rtA.dispose(); rtB.dispose(); }
    rtScene = new THREE.WebGLRenderTarget(w, h, rtOpts);
    rtA = new THREE.WebGLRenderTarget(w >> 1, h >> 1, rtOpts);
    rtB = new THREE.WebGLRenderTarget(w >> 1, h >> 1, rtOpts);
  }
  buildTargets(window.innerWidth, window.innerHeight);

  const brightPass = makePass(`
    uniform sampler2D tex; uniform float threshold; varying vec2 vUv;
    void main() {
      vec3 c = texture2D(tex, vUv).rgb;
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      gl_FragColor = vec4(c * smoothstep(threshold, threshold + 0.35, l), 1.0);
    }`, { tex: { value: null }, threshold: { value: 0.72 } });

  const blurPass = makePass(`
    uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;
    void main() {
      vec3 sum = texture2D(tex, vUv).rgb * 0.227;
      sum += (texture2D(tex, vUv + dir * 1.384).rgb + texture2D(tex, vUv - dir * 1.384).rgb) * 0.316;
      sum += (texture2D(tex, vUv + dir * 3.230).rgb + texture2D(tex, vUv - dir * 3.230).rgb) * 0.070;
      gl_FragColor = vec4(sum, 1.0);
    }`, { tex: { value: null }, dir: { value: new THREE.Vector2() } });

  const compositePass = makePass(`
    uniform sampler2D base; uniform sampler2D bloom; uniform float strength; varying vec2 vUv;
    void main() {
      vec3 col = texture2D(base, vUv).rgb + texture2D(bloom, vUv).rgb * strength;
      gl_FragColor = vec4(col, 1.0);
    }`, { base: { value: null }, bloom: { value: null }, strength: { value: 0.85 } });

  function renderWithBloom() {
    renderer.setRenderTarget(rtScene);
    renderer.render(scene, camera);

    brightPass.mat.uniforms.tex.value = rtScene.texture;
    renderer.setRenderTarget(rtA);
    renderer.render(brightPass.scene, quadCam);

    const w = rtA.width, h = rtA.height;
    for (let i = 0; i < 2; i++) {
      blurPass.mat.uniforms.tex.value = rtA.texture;
      blurPass.mat.uniforms.dir.value.set(1 / w, 0);
      renderer.setRenderTarget(rtB);
      renderer.render(blurPass.scene, quadCam);
      blurPass.mat.uniforms.tex.value = rtB.texture;
      blurPass.mat.uniforms.dir.value.set(0, 1 / h);
      renderer.setRenderTarget(rtA);
      renderer.render(blurPass.scene, quadCam);
    }

    compositePass.mat.uniforms.base.value = rtScene.texture;
    compositePass.mat.uniforms.bloom.value = rtA.texture;
    renderer.setRenderTarget(null);
    renderer.render(compositePass.scene, quadCam);
  }

  // ---------- Mouse parallax ----------
  const mouse = { x: 0, y: 0 };
  const parallax = { x: 0, y: 0 };
  window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
  });
  window.addEventListener('touchmove', e => {
    if (!e.touches.length) return;
    mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    mouse.y = (e.touches[0].clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });

  // ---------- Animation ----------
  const clock = new THREE.Clock();
  const ORBIT_PERIOD = 36;                 // seconds per full revolution — > 30 s, all sides shown
  const startAngle = Math.PI * 0.72;       // begins at a rear-three-quarter view
  const lookTarget = new THREE.Vector3();
  const RIDE_SPEED = reducedMotion ? 6 : 14;   // world units/s the road flows past

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // --- riding motion: wheels spin, chassis vibrates, road scrolls ---
    const wheelSpin = RIDE_SPEED / 0.47;
    rearWheel.rotation.x  += wheelSpin * dt;
    frontWheel.rotation.x += wheelSpin * dt;
    bike.position.y = Math.sin(t * 17) * 0.008 + Math.sin(t * 5.3) * 0.006;
    bike.rotation.z = Math.sin(t * 0.7) * 0.03;                 // gentle lean sway
    rider.rotation.x = Math.sin(t * 1.1) * 0.02;
    reflection.position.y = -bike.position.y;
    reflection.rotation.z = -bike.rotation.z;

    for (const d of dashes) {
      d.position.z += RIDE_SPEED * dt;
      if (d.position.z > 70) d.position.z -= 140;
    }
    for (const p of posts) {
      p.position.z += RIDE_SPEED * dt;
      if (p.position.z > 70) p.position.z -= 140;
    }
    asphaltTex.offset.y -= (RIDE_SPEED * dt) / (300 / 46);

    // brake light pulse
    brakeMat.emissiveIntensity = 3.4 + Math.sin(t * 3.2) * 0.9;
    brakePoint.intensity = 1.3 + Math.sin(t * 3.2) * 0.5;

    // --- smoke ---
    for (let i = 0; i < SMOKE_COUNT; i++) {
      sLife[i] += dt;
      if (sLife[i] >= sMaxLife[i]) resetParticle(i, false);
      const k = sLife[i] / sMaxLife[i];
      const v = sVel[i];
      // turbulence
      const turb = 0.9;
      sPos[i * 3]     += (v.x + Math.sin(t * 2.1 + sSeed[i]) * turb * k) * dt;
      sPos[i * 3 + 1] += (v.y + Math.sin(t * 1.6 + sSeed[i] * 2.0) * 0.25) * dt;
      sPos[i * 3 + 2] += (v.z * (1.0 - k * 0.55) + Math.cos(t * 1.8 + sSeed[i]) * turb * k) * dt;
      sAlpha[i] = Math.sin(Math.min(k, 1) * Math.PI) * 0.5 * (1 - k * 0.35);
      sSize[i] = (0.3 + k * 1.5);
    }
    smokeGeo.attributes.position.needsUpdate = true;
    smokeGeo.attributes.aAlpha.needsUpdate = true;
    smokeGeo.attributes.aSize.needsUpdate = true;

    // --- cinematic orbit camera: full 360° every ORBIT_PERIOD seconds ---
    const angle = startAngle + (t / ORBIT_PERIOD) * Math.PI * 2 * (reducedMotion ? 0.35 : 1);
    const radius = 6.4 + Math.sin(t * 0.21) * 0.8;
    const camX = Math.cos(angle) * radius;
    const camZ = Math.sin(angle) * radius;
    const camY = 1.15 + Math.sin(t * 0.33) * 0.45 + 0.25;       // stays low to the ground

    // mouse parallax drift, smoothed
    parallax.x += (mouse.x - parallax.x) * 2.2 * dt;
    parallax.y += (mouse.y - parallax.y) * 2.2 * dt;

    camera.position.set(
      camX + parallax.x * 0.9,
      Math.max(camY - parallax.y * 0.55, 0.45),
      camZ
    );
    lookTarget.set(-parallax.x * 0.6, 0.95 + parallax.y * 0.25, 0.1);
    camera.lookAt(lookTarget);

    renderWithBloom();
  }
  animate();

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    buildTargets(w, h);
  });
})();
</script>
</body>
</html>
