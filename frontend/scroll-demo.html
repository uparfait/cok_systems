<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Requests chart scroll demo</title>
    <style>
      body { font-family: sans-serif; background: #f3f4f6; margin: 0; padding: 16px; }
      /* same scrollbar styling as the app's globals.css */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #056daa; border-radius: 10px; }

      .no-scrollbar::-webkit-scrollbar { display: none; }

    <div id="root"></div>
    <script type="module" src="/scroll-demo.tsx"></script>
