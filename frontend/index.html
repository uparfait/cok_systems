    <!-- Structured description of the platform and each of its systems, for search engines and assistants. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "IKAZE",
      "alternateName": "IKAZE - City of Kigali Digital Services",
      "url": "https://ikaze.kigalicity.gov.rw/",
      "image": "https://ikaze.kigalicity.gov.rw/LOGO_COK.png",
      "description": "The City of Kigali digital services platform. It brings together service delivery, smart parking, event and room management, task management, data collection with dashboards, and administration.",
      "applicationCategory": "GovernmentApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires a modern web browser",
      "inLanguage": ["en", "fr", "rw"],
      "publisher": {
        "@type": "GovernmentOrganization",
        "name": "City of Kigali",
        "url": "https://www.kigalicity.gov.rw/",
        "logo": "https://ikaze.kigalicity.gov.rw/LOGO_COK.png"
      },
      "hasPart": [
        {
          "@type": "WebApplication",
          "name": "Service Delivery",
          "description": "Visitors check in at reception, are directed to the right department and employee, and can leave feedback. Departments track requests, service time and performance."
        },
        {
          "@type": "WebApplication",
          "name": "Smart Parking",
          "description": "Entry and exit of vehicles and people at city premises, live parking slot status, staff cars and flagged vehicles."
        },
        {
          "@type": "WebApplication",
          "name": "Event Management",
          "description": "Meeting rooms, live and upcoming events, room booking requests, invitations, attendance with QR codes and meeting minutes."
        },
        {
          "@type": "WebApplication",
          "name": "Task Management",
          "description": "Tasks, follow-ups and requests assigned across departments, with comments, checklists and notifications."
        },
        {
          "@type": "WebApplication",
          "name": "Data Collection System",
          "description": "Build forms, collect responses online or offline in the field, route them for approval, translate forms, export data, share dashboards and connect analysis tools."
        },
        {
          "@type": "WebApplication",
          "name": "Administration",
          "description": "Departments, employees, user accounts, roles and access, system audit, storage and analytics for the whole platform."
        }
      ]
    }
    </script>
