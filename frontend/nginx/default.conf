# ============================================================================
# Internal Frontend Nginx Configuration
# Listens on port 5713 inside the Docker network.
# Proxies API requests to backend services using Docker service names.
# ============================================================================

server {
    listen 5713;
    server_name uat-ikaze.kigalicity.gov.rw;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Let's Encrypt domain-validation challenge (shared volume with host)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Event management API
    location /cok/api/v1/ {
        proxy_pass http://em-backend:2027;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main API
    location /cok/api/ {
        proxy_pass http://backend:2026;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files served by the main backend
    location /uploads/ {
        proxy_pass http://backend:2026;
        proxy_set_header Host $host;
    }

    # WebSocket (socket.io) — needs the upgrade headers
    location /socket.io/ {
        proxy_pass http://backend:2026;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # React single-page app — all other routes fall back to index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}